<link rel="stylesheet" href="/css/plugins/flags.min.css">
<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(099) 999-99-99", {
            placeholder:"+38(0__) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<div id="basket_block">

    <div class="basket">

        <div class="basket-header">
            <div class="row align-items-center">
                <div class="offset-10 col-2">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
            </div>
            <div class="row align-items-center">
                <div class="col-6 basket-header-col">
                    <span>{goods_in_basket}: {count}</span>
                </div>
                <div class="col-6 basket-header-col">
                    <div class="radio-group">
                        {currency}
                    </div>
                </div>
            </div>
        </div>

        <div class="basket-table">
            <div class="col-12">
                <div class="row align-items-center basket-table-thead">
                    <div class="col-4">{caption_cap}</div>
                    <div class="col-2 text-center">{storage_info}</div>
                    <div class="col-2">{count_cap}</div>
                    <div class="col-1 text-center">{price_cap}</div>
                    <div class="col-2 text-center">{total_cap}</div>
                    <div class="col-1 pad0">
                        <label class="container_check d-inline">
                            <input type="checkbox" id="check_all_box" class="btn" {checked_status} onclick="checkAllBasket();" title="Check all">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                </div>
                {basket_rows}
            </div>
        </div>

        <div class="basket-phone">
            <div class="col-12">
                <div class="row">
                    {basket_phone_rows}
                </div>
            </div>
        </div>

        <div class="basket-footer">
            <div class="row">
                <div class="col-12 basket-footer-total">
                    <span>{total_cap}: <b>{sum_total}</b> {cur_cap}</span>
                </div>
                <div class="col-12 basket-footer-total {total_style}">
                    <span>{total_checked_cap}: <b>{sum}</b> {cur_cap}</span>
                </div>
                <div class="col-lg-6 col-12 basket-footer-buttons order-lg-0 order-1">
                    <a class="text-center pointer" data-dismiss="modal"><i class="fa fa-chevron-left"></i> {back_to_buy}</a>
                </div>
                <div class="col-lg-6 col-12 basket-footer-buttons order-lg-1 order-0">
                    <button id="make_order" onclick="{location}" {disabled} class="btn btn-primary">{make_order}</button>
                </div>
            </div>
        </div>

        <div class="basket-fast">
            <div class="row">
                <div class="col-lg-6 col-12">
                    <p><b>{make_order_fast_cap}</b></p>
                    <p>{make_order_fast_text}</p>
                </div>
                <div class="col-lg-6 col-12">
                    <p><b>{phone_number_input}:</b></p>
                    <div class="container">
                        <div class="row align-items-center">
                            <div class="col-lg-6 col-11 basket-fast-phone">
                                <input
                                    id="input_phone2" class="form-control masked-phone" type="tel" name="phone"
                                    placeholder="+38(0__) ___-__-__" onchange="validationInput('input_phone2');"
                                    title="{input_valid_phone}" data-toggle="tooltip" data-placement="top" data-html="true"
                                >
                            </div>
                            <div class="col-lg-1 col-1 basket-fast-valid"><i id="validate_input_phone2" class="fas fa-times-circle non_accept validate_input"></i></div>
                            <div class="col-lg-5 col-12 basket-fast-button"><button onclick="{location_fast}" class="btn btn-primary">{make_order_fast}</button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
