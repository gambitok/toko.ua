<div class="row align-items-center basket__table-tbody">

    <div class="col-4 search__basket">
        <div class="row">
            <div class="col-3">
                <img src="{product_image}" alt="{art_name}" class="search__img">
            </div>
            <div class="col-9 pad0">
                <span class="search__brand tooltips" data-toggle="tooltip" data-placement="bottom" title="{country_name}">{flag} {brand_name}</span> <a class="search__art" href="{link}">{art_name}</a>
                <br><span class="search__name">{text}</span>
            </div>
        </div>
        <span class="search__date">{date_added_basket}: {date1}</span>
    </div>

    <div class="col-2 search__delivery">
        <span class="tooltips" data-toggle="tooltip" data-placement="bottom" title="{delivery_info}" data-html="true"><i class="fas fa-stopwatch"></i> {delivery_short_info}</span>
    </div>

    <div class="col-2">
        <div class="input-group input-group-sm">
            <div class="input-group-prepend">
                <button class="btn btn-sm btn-outline-secondary" onclick="updateCountBasket(0,{art_id},{storage_id},{stock},0);">-</button>
            </div>
            <input id="{amount_field}" class="show_count form-control" title="count" min="0" value="{amount}" onchange="updateBasketForm({art_id},{storage_id},{stock},0);">
            <div class="input-group-append">
                <button class="btn btn-sm btn-outline-secondary" onclick="updateCountBasket(1,{art_id},{storage_id},{stock},0);">+</button>
            </div>
        </div>
    </div>

    <div class="col-1 search__price">
        <span class="search__price">{price} {cash_abr}</span> {action}
    </div>

    <div class="col-2 text-center">
        <span class="search__total">{full_price} {cash_abr}</span>
    </div>

    <div class="col-1 pad0">
        <div class="row mar0">
            <div class="col-6 pad0">
                <label class="container_check d-inline">
                    <input id="{art_id}" name="{storage_id}" type="checkbox" {checked} class="check-brand" onclick="checkBasketItem({art_id},{storage_id},this);">
                    <span class="checkmark"></span>
                </label>
            </div>
            <div class="col-6 pad0">
                <button class="btn-basket pointer" onclick='deleteFromBasket({art_id},{storage_id},"{art_name}");'><i class="fa fa-trash-alt"></i></button>
            </div>
        </div>
    </div>

</div>
