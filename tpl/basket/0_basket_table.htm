<link rel="stylesheet" href="/css/pages/basket.css">
<link rel="stylesheet" href="/css/pages/catalogue.css">
<link rel="stylesheet" href="/css/plugins/flags.min.css">

<div id="basket_block" class="content">

    <div class="row search_title align-items-center">
        <div class="col-lg-6 col-6">
            <h1>{basket_cap}</h1>
        </div>
        <div class="col-lg-6 col-6 pad0">
            <div class="radio-group">
                {currency}
            </div>
        </div>
    </div>

    <div class="basket-table">
        <div class="row align-items-center basket-tr basket-th">
            <div class="col-10 col-lg-1 basket-td basket-date" title="{date_add_update}">{date_cap}</div>
            <div class="col-12 col-lg-2 basket-td basket-art" title="{art_brand_name_cap}">{caption_cap}</div>
            <div class="col-12 col-lg-1 basket-td basket-brand">&nbsp</div>
            <div class="col-12 col-lg-2 basket-td basket-text">&nbsp</div>
            <div class="col-12 col-lg-1 basket-td basket-dd">{del_time}</div>
            <div class="col-12 col-lg-1 basket-td basket-count">{count_cap}</div>
            <div class="col-12 col-lg-1 basket-td basket-price text-center" title="{price_per_cap}">{price_cap}</div>
            <div class="col-12 col-lg-1 basket-td basket-fprice text-center">{total_cap}</div>
            <div class="col-12 col-lg-1 basket-td basket-remove">&nbsp</div>
        </div>
        {basket_rows}
    </div>
    <div class="row basket-summ">
        <div class="col-12 text-right bold pad0">
            <span>{total_cap}: <i>{summ}</i> {cur_cap}</span>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 col-4 pad0">
            <button id="check_all_box" value="true" class="btn" onclick="checkAllBasket();">{check_all}</button>
        </div>
        <div class="col-lg-4 col-8 pad0">
            <button id="make_order" onclick="{location}" {disabled} class="btn btn-order btn-primary btn-outline-secondary">{make_order}</button>
        </div>
    </div>
</div>
