<div class="auto_table" style="width: 100%;">
	<div class="row auto_table--row padb15 padt15">
		<div class="col-12 col-lg-2 auto_table--col">
			<select id="select_auto" title="{auto_cap}" onchange="selectModel();" class="js-example-basic-single">{select_auto}</select>
		</div>
		<div class="col-12 col-lg-2 auto_table--col">
			<select id="select_model" title="{model_cap}" onchange="selectModelID();" class="js-example-basic-single">{select_model}</select>
		</div>
		<div class="col-12 col-lg-2 auto_table--col">
			<select id="select_modelid" title="{model_number}" onchange="selectGroup();" class="js-example-basic-single">{select_modelid}</select>
		</div>
		<div class="col-12 col-lg-2 auto_table--col">
			<select id="select_group" title="detail_group" onchange="selectEnd();" class="js-example-basic-single">{select_group}</select>
		</div>
		<div class="col-6 col-lg-3 auto_table--col">
			<button onClick="addGarage();" class="btn btn-search-auto btn-outline-secondary btn-primary" type="button" title="{garage_add}" style="width: auto;padding: 0 5px;"><i class="fa fa-car"></i> {garage_add}</button>
		</div>
		<div class="col-6 col-lg-1">
			<div class="swipe"><a class="pointer" onclick="toggleBlock('auto_list_arrow','toggle_auto_list');"><i class="fas fa-chevron-down rotate_anime"></i></a></div>
		</div>
	</div>
	<div id="toggle_auto_list" class="toggle_auto_list">
		{catalogue_tab_search}
	</div>
	<div id="toggle_history" class="toggle_history">
		<h5>{history_cap}</h5>
		<div id="toggle_history-block"></div>
	</div>
</div>
