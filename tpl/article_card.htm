<div class="col-lg-4 col-12 pad0">

    <div class="article-card">

        <div class="article-card-main">

            <div class="row">
                <div class="col-12">
                    <a itemprop="url" href="https://toko.ua{product_lang_prefix}/article/{product_format_name}/{product_format_brand}/{art_id}/">
                        <div class="search__photo">
                            <img class="lazy" data-src="{product_image}" alt="{product_title}" title="{product_title}">
                        </div>
                    </a>
                </div>
            </div>

            <div class="row article-card__name">
                <div class="col-12">
                    <a class="search__link" itemprop="url" href="https://toko.ua{product_lang_prefix}/article/{product_format_name}/{product_format_brand}/{art_id}/">
                        <span class="search__brand">{product_brand}</span>
                        <span class="search__name">{product_text}</span>
                        <span class="search__art">{product_name}</span>
                    </a>
                </div>
            </div>

            <div class="row {soldout_row_status} align-items-center article-card__price">
                <div class="col-12">
                    <div class="search__soldout">{sold_out_cap}</div>
                </div>
            </div>

            <div class="row {price_row_status} align-items-center article-card__price">
                <div class="col-12">
                    <span class="search__name">{price_cap}: </span>
                    <span class="search__true_price">{product_price}</span>
                </div>
            </div>

            <div class="row article-card__buy">
                <div class="col-12">
                    <input type="hidden" value="1" id="count_{product_i}">
                    <button class="btn-group btn btn-md btn-info float-right {product_button}" onclick="moveBasket({product_i},'{art_id}','{brand_id}','{product_real_stock}','{product_storage_id}',{product_suppl_id});">{buy_cap}</button>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="tables__delivery applicable {applicable_display}">{product_auto_appl}</div>
                </div>
            </div>

            <div class="row {price_row_status} article-card__info">
                <div class="col-12 {product_button}">
                    <span class="search__name">{in_stock}:</span> <span>{product_stock} {amount_abbr}.</span>
                </div>
                <div class="col-12 {product_delivery_class} {product_button}">
                    <span class="search__name">{storage_info}:</span> {product_delivery_short_info}
                </div>
            </div>

            <div class="row">
                <div class="col-12 article-card__offers">
                    {product_test_offers}
                </div>
            </div>

        </div>

        <div class="article-card-hidden">{product_info}</div>

    </div>

</div>
