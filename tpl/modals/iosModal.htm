<!-- default Modal -->
<div class="modal fade" id="defaultModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <input type="hidden" value="Telegram" id="contact_telegram">
            <input type="hidden" value="Facebook Messenger" id="contact_facebook">
            <input type="hidden" value="Viber" id="contact_viber">
            <input type="hidden" value="{phone_call_cap} (097) 080 30 60" id="contact_phone">
            <input type="hidden" value="{phone_call_cap} (050) 080 30 60" id="contact_phone2">
            <input type="hidden" value="{phone_call_cap} (093) 080 30 60" id="contact_phone3">
            <input type="hidden" value="{cancel_cap}" id="contact_cancel">
            <div class="modal-body" id="body-default">
                {phone_call_info}
            </div>
            <div class="modal-footer">
            </div>
        </div>
    </div>
</div>
