<!--Phone Search-->
<div class="modal fade modal-gallery modal-phone" id="PhoneArticle" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-left">
                <div class="container">
                    <div class="input-group">
                        <input id="search_art3" type="text" class="form-control" placeholder="{search_onsite}" title="{search_onsite}" aria-describedby="basic-addon2">
                        <div class="input-group-append">
                            <button onClick="artSearch('search_art3');" class="btn btn-outline-secondary btn-primary btn-search-art" type="button"><span class="fas fa-search"></span></button>
                        </div>
                    </div>
                    <div id="modal-phone__history" class="modal-phone__history search"></div>
                </div>
            </div>
        </div>
    </div>
</div>
