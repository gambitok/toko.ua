<!-- Modal Info-->
<div class="modal fade" id="InfoForm" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <span id="info_title">{info_title}</span>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-left pad0">
                <div id="info_content">{info_content}</div>
            </div>
        </div>
    </div>
</div>
