<div class="modal-brand">
    <div class="modal-brand__item">
        <h2>{about_brand_cap} <span>{brand_form_name} <img itemprop="image" class="flag flag-{brand_form_country}"></span></h2>
    </div>
    <div class="modal-brand__item">
        <div class="modal-brand__item-text">
            <p>{brand_form_descr}</p> <br>
            <span>{brand_form_link}</span>
        </div>
        <div class="modal-brand__item-logo">
            <img
                class="lazy {brand_form_logo_class}"
                itemprop="image"
                src="/images/no_photo.svg"
                data-src="{brand_form_logo_name}"
                alt="{brand_form_name}"
            >
        </div>
    </div>
</div>
