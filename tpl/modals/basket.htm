<!-- Modal Basket-->
<div class="modal fade" id="BasketForm" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">{basket_cap}</span>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-left">
                <div class="container">
                    <div class="row">
                        <div id="basket_block" class="container">
                            {basket_content}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
