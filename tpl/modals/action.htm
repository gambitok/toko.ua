<!-- Modal Action-->
<div class="modal fade" id="ActionForm" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title span-red text-center wdt100">TOKO Assistance</span>
            </div>
            <div class="modal-body text-left">
                <div class="container">
                    <div class="row">
                        <div class="col-12" style="text-align: center;font-size: 2.5em;">
								<span class="span-green tooltips" data-toggle="tooltip" data-placement="bottom" data-html="true"
                                      title="
									<span class='span-red' style='font-size:1.2em'>{price_cap} 42.54 UAH, {from_cap} 20 {amount_abbr}.</span> <br>
									{offer_valid_until}: {indefinitely_cap} <br>
									{quantity_limited}: {no_cap}
								">
								<span class="fa fa-box-open"></span></span>
                        </div>
                        <div class="col-12 text-center">
                            {action_rules}
                        </div>
                        <div class="col-12" style="text-align: center;font-size: 2.5em;">
                            <span class="span-green"><span class="fa fa-box-open"></span></span>
                        </div>
                        <div class="offset-2 col-8 text-center" style="background: black; color: white; border-radius: 0.25em; line-height: 1.2; padding: 10px;">
								<span class="span-red" style="font-size:1em">
									{price_cap} 42.54 UAH, {from_cap} 20 {amount_abbr}.
								</span> <br>
                            <span style="font-size:0.8em">
									{offer_valid_until}: {indefinitely_cap} <br>
									{quantity_limited}: {no_cap}
								</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
