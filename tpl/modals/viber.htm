<!-- Viber Modal -->
<div class="modal fade contact-form contact-form--purple" id="ViberForm" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="contact-form-social">
                    <div class="contact-form-social__item">
                        <div class="contact-form-social__item-title">
                            <span>{contact_viber_pc_title}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-max">
                            <img class="lazy" data-src="/images/contacts/viber/viber_pc.png" src="/images/no_photo.svg" alt="viber">
                        </div>
                        <div class="contact-form-social__item-text">
                            <span>{contact_viber_pc_text}</span>
                        </div>
                        <div class="contact-form-social__item-button">
                            <a href="viber://pa?chatURI=tokogroup" rel="noopener" target="_blank">{contact_viber_pc_open}</a>
                        </div>
                    </div>
                    <div class="contact-form-social__item">
                        <div class="contact-form-social__item-title">
                            <span>{contact_viber_phone_title}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-max">
                            <img class="lazy" data-src="/images/contacts/viber/viber_phone.png" src="/images/no_photo.svg" alt="viber">
                        </div>
                        <div class="contact-form-social__item-text">
                            <span>{contact_viber_phone_text}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-min">
                            <img class="lazy" data-src="/images/contacts/viber/viber_qrcode.png" src="/images/no_photo.svg" alt="viber">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
