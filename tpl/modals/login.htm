<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(999) 999-99-99", {
            placeholder:"+38(___) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>
<!-- Modal Login-->
<div class="modal fade" id="LoginModal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">{authorization}</span>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="offset-1 col-10">
                            <form action="" onsubmit="return false;" autocomplete="off">
                                <input class="clearAll TextBox" id="loginform" type="hidden" name="loginform" value="1">
                                <input class="clearAll TextBox" id="remember" type="hidden" name="remember" value="1">
                                <div class="auth-input">
                                    <label class="auth-label">{client_login}</label><br>
                                    <input id="userlogin" name="userlogin" title="{phone_cap}" class="form-control masked-phone" type="tel" placeholder="+38(___) ___-__-__">
                                </div><br>
                                <div class="auth-input">
                                    <label class="auth-label">{client_password_cap}</label><br>
                                    <input class="form-control" id="userpassword" type="password" name="userpassword" placeholder="{input_password}" title="{password_cap}">
                                </div><br>
                                <input class="btn btn-primary" type="submit" value="{login}" onClick="loginForm();"><br><br>
                                <a class="dblock" href="https://toko.ua{site_lang_prefix}/recover_password/">{forget_password}?</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
