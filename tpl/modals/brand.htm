<!-- Modal Brand-->
<div class="modal fade" id="BrandForm" role="dialog" tabindex="-1">
    <div class="modal-dialog" style="max-width: 1000px;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">{info_cap}</span>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-left">
                <div class="container">
                    <div class="row">
                        <div id="info_brand">
                            {brand_info}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
