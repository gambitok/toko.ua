<!-- Telegram Modal -->
<div class="modal fade contact-form contact-form--blue" id="TelegramForm" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="contact-form-social">
                    <div class="contact-form-social__item">
                        <div class="contact-form-social__item-title">
                            <span>{contact_telegram_pc_title}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-max">
                            <img class="lazy" data-src="/images/contacts/telegram/telegram_pc.png" src="/images/no_photo.svg" alt="telegram">
                        </div>
                        <div class="contact-form-social__item-text">
                            <span>{contact_telegram_pc_text}</span>
                        </div>
                        <div class="contact-form-social__item-button">
                            <a href="https://t.me/tokoua_bot" rel="noopener" target="_blank">{contact_telegram_pc_open}</a>
                        </div>
                    </div>
                    <div class="contact-form-social__item">
                        <div class="contact-form-social__item-title">
                            <span>{contact_telegram_phone_title}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-max">
                            <img class="lazy" data-src="/images/contacts/telegram/telegram_phone.png" src="/images/no_photo.svg" alt="telegram">
                        </div>
                        <div class="contact-form-social__item-text">
                            <span>{contact_telegram_phone_text}</span>
                        </div>
                        <div class="contact-form-social__item-image contact-form-social__item-image-min">
                            <img class="lazy" data-src="/images/contacts/telegram/telegram_qrcode.png" src="/images/no_photo.svg" alt="telegram">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
