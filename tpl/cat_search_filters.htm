<style>
    .slider-handle {
        background: #ccc!important;
        background-image: linear-gradient(to bottom,#ccc 0,#ccc 100%);
        box-shadow: inset 0 0 2px grey!important;
    }
    .slider-selection {
        background: #ccc!important;
        box-shadow: inset 0 0 2px #ccc!important;
    }
</style>

<div id="cat_search_filters">
    <div class="row">
        <div id="search_filters_block" class="wdt100">
            <div class="side-menu">
                <div class="side-menu-item">
                    <div class="side-menu-item__header">{price_cap}</div>
                    <div class="side-menu-item__input">
                        <input type="text" title="{price_cap}" id="price_val_min" value="0">
                        <span>-</span>
                        <input type="text" title="{price_cap}" id="price_val_max" value="{sideblock_max_price}">
                        <button onClick="{catalogue_js_filter}">OK</button>
                    </div>
                    <span id="price_val" style="display: none;">0,{sideblock_max_price}</span>
                    <div style="display: block; margin: 0 10px;">
                        <input id="filter-price" title="{price_cap}" type="text" class="span2" value="" data-slider-min="0" data-slider-max="{sideblock_max_price}" data-slider-step="1" data-slider-value="[{sideblock_min_price_val},{sideblock_max_price_val}]" style="width: 100%"/>
                    </div>
                    <span style="display: none;">0</span>
                    <span id="filter-max-price" class="float-right" style="display: none;">{sideblock_max_price}</span>
                </div>
                <div class="side-menu-item">
                    <div class="side-menu-item__header">{delivery_cap}</div>
                    <div class="side-menu-item__input">
                        <input type="text" title="{price_cap}" id="dd_val_min" value="0">
                        <span>-</span>
                        <input type="text" title="{price_cap}" id="dd_val_max" value="{sideblock_max_dd}">
                        <button onClick="{catalogue_js_filter}">OK</button>
                    </div>
                    <span id="dd_val" style="display: none;">0,{sideblock_max_dd}</span>
                    <div style="display: block; margin: 0 10px;">
                        <input id="filter-delivery" title="{delivery_cap}" type="text" class="span2" value="" data-slider-min="0" data-slider-max="{sideblock_max_dd}" data-slider-step="1" data-slider-value="[{sideblock_min_dd_val},{sideblock_max_dd_val}]" style="width: 100%"/>
                    </div>
                    <span style="display: none;">0</span>
                    <span class="float-right" style="display: none;">{sideblock_max_dd}</span>
                </div>
<!--                <div class="side-menu-item">-->
<!--                    <button onClick="{catalogue_js_filter_clear}" class="btn btn-outline-secondary btn-outline-primary" type="button">{filter_cap_empty}</button>-->
<!--                </div>-->
            </div>
        </div>
    </div>
</div>
