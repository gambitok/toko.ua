<div class="{search_form_col}" style="padding-right: 0; padding-left: 0;">
	<div id="search_form" style="padding: 0;">
		<div id="result_table" class="content" style="min-height: 400px; width: 100%;">
			<div class="container">
				<div class="row search_title align-items-center">
					<div class="col-lg-12 col-12 pad0 word-wrap">
						<h5>{search_results} <span style="color:#f44336">{art}</span></h5>
						<h6>{search_result_index}</h6>
					</div>
					<div class="col-lg-6 col-12 pad0">
						<div class="radio-group" style="float: right; width: 100%; text-align: right;">
							{currency}
						</div>
					</div>
				</div>
			</div>
			<div class="container">
				<div class="row">
					{search_result}
				</div>
			</div>
		</div>
	</div>
</div>
