<div class="catalogue-search">
    <div class="row">
        <div class="container pad0 cat_search_auto_container">
            {cat_search_auto}
        </div>
    </div>
    <div id="search_target" class="row wdt100 mar0 flex-column-reverse flex-md-row">
        <div class="{filters_col}">
            {cat_search_new_tree}
            {cat_search_tree}
            {cat_search_filters}
            {cat_search_brands}
        </div>
        <div id="result_target" class="{search_col}">
            <input id="type_search" type="hidden" value="{type_search}">
            <input id="art_value" type="hidden" value="{art_value}">
            <input id="brand_value" type="hidden" value="{brand_value}">
            <input id="cur_value" type="hidden" value="{cur_value}">
            {cat_search_main}
        </div>
    </div>
</div>
