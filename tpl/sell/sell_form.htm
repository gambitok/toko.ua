<link rel="stylesheet" href="/js/plugins/dropzone/dropzone.css">

<div class="content">

    <div class="sell">
        <div class="sell-title">
            <h1>{terms_of_cooperation}</h1>
        </div>

        <div class="sell-navs">
            <ul class="nav nav-tabs">
                <li><a data-toggle="tab" href="#menu1" class="active show">{first_step_cap}</a></li>
                <li><a data-toggle="tab" href="#menu2">{terms_of_cooperation}</a></li>
            </ul>
            <div class="tab-content">
                <div id="menu1" class="tab-pane fade in active show">
                    {deal_cap}
                </div>
                <div id="menu2" class="tab-pane fade">
                    {terms_cap}
                </div>
            </div>
        </div>
    </div>

</div>

<div class="modal inmodal fade filePhotoUploadForm in" id="filePhotoUploadForm" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="filePhotoUploadLabel">{upload_file_title}</h4>
            </div>
            <div class="modal-body" id="fileViewHolderFoto">
                <form action="/file_upload.php" class="dropzone dz-clickable" id="myDropzone" enctype="multipart/form-data">
                <div class="dz-default dz-message"><span>{upload_file_field}</span></div></form>
            </div>
        </div>
    </div>
</div>

<script src="/js/plugins/dropzone/dropzone.js"></script>

<script type="text/javascript">
    Dropzone.autoDiscover = false;
</script>
