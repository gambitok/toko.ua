<input type="hidden" id="json_filters" value='{json_filters}'>
<input type="hidden" id="json_active_filters" value='{json_active_filters}'>
<input type="hidden" id="json_products" value='{json_products}'>
<input type="hidden" id="json_active_products" value='{json_active_products}'>

<div id="result_target" class="container pad0">
    <div class="row">
        <div class="col-12 col-lg-3">
            <div class="content">
                <button class="btn btn-warning wdt100" onclick="clearFilters();">{filter_cap_empty}</button>
                <div id="template_filters" class="template_filters" style="margin-bottom: 1em;">
                    {template_filters}
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-9 padl0">
            <div class="content search_template">
                <div class="row">
                    <div class="col-12 col-lg-10 search_title">
                        <h1>{offers_request} <span class="span-red">{template_name}</span> {and_analogs}</h1>
                        <input id="template_id" type="hidden" value="{template_id}">
                    </div>
                    <div class="col-4 offset-8 offset-lg-0 col-lg-2">
                        <select id="select_count" name="select_count" class="form-control" title="{page_quantity}" onchange="initProductsForm(1);">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                </div>
                <div id="template_products" class="template_products">
                    {template_products}
                </div>
            </div>
        </div>
    </div>
</div>
