<div id="cat_search_brands" class="{brands_display}">
    <div class="row">
        <div class="wdt100">
            <div class="side-menu">
                <div class="side-menu__item">
                    <a class="side-menu__item-title" onclick="$('#container-brands').toggleClass('container_brands')">
                        <span class="side-menu__item-title-h">{brands_cap}</span>
                        <span class="side-menu__item-title-i"><i class="fa fa-chevron-down rotate__animation"></i></span>
                    </a>
                    <div id="container-brands" class="side-menu__item-content container_brands">
                        {brands_list}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
