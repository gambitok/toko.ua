<div id="tables" class="container tables">
    <div class="row tables__title {cat_product_view}">
        <div id="tables__name" class="col-lg-2 pointer" onclick="{cat_js_filter}('name');">
            {index_cap} <span class="fas {cat_sort_1}"></span>
        </div>
        <div class="col-lg-3">{caption_cap}</div>
        <div id="tables__dd" class="col-lg-2 text-center pointer" title="{cat_storage_info}" onclick="{cat_js_filter}('dd');">
            {storage_info} <span class="fas {cat_sort_2}"></span>
        </div>
        <div id="tables__stock" class="col-lg-1 text-center pointer pad0" onclick="{cat_js_filter}('stock');">
            {available_cap} <span class="fas {cat_sort_3}"></span>
        </div>
        <div id="tables__price" class="col-lg-2 text-center pointer" onclick="{cat_js_filter}('price');">
            {price_cap} <span class="fas {cat_sort_4}"></span>
        </div>
        <div class="col-lg-1">&nbsp</div>
    </div>
