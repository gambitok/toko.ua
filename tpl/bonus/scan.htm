<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<script>
    function recaptchaCallback() {
        $("input[type='submit']").prop('disabled', false);
    }
    $(document).ready(function(){
        $(".masked-phone").mask("+38(099) 999-99-99", {
            placeholder:"+38(0__) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<div class="content" style="text-align: justify;">

    <div class="row">
        <div class="col-lg-11 col-9"><h1>{hello_qr_cap}</h1></div>
        <div class="col-lg-1 col-3"><img src="/images/icons/bonus/bonus-1.png" alt="bonus" class="wdt100"></div>
    </div>
    <hr>
    <p>{bonus_title}</p>
    <p>{bonus_content}</p>
    <div class="row">
        <div class="col-lg-6 col-12">
            <form action="" method="POST">
                <input id="phone" title="{phone_cap}" class="form-control masked-phone" name="bonus_phone" type="tel" placeholder="+38(0__) ___-__-__">
                <br/>
                <div class="g-recaptcha" data-sitekey="6Lfl4ZYUAAAAADHfyeRU4-_byLTXBh4GBhw8Lcin" data-callback="recaptchaCallback"></div>
                <br/>
                <input class="btn btn-primary-outline" type="submit" value="{bonus_button}" disabled>
            </form>
        </div>
    </div>
</div>
