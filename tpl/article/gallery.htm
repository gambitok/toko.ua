<script src="/gallery/fancybox/jquery.fancybox.js?v=2.1.4"></script>
<script>
    $(document).ready(function(){
        $('.gr__item.full').append("<img src='" + $('.gr__item .selected').attr('data-full') + "'>");

        $('.gr__item a').click(function(){
            let largeImage = $(this).attr('data-full');
            $('.gr__item .selected').removeClass();
            $(this).addClass('selected');
            $('.gr__item.full img').hide().attr('src', largeImage).fadeIn();
        });

        $('.gr__item.full img').on('click', function(){
            let arr = [];
            $( "#grItem img" ).each(function() {
                let a = $(this).attr('src');
                arr.push(a);
            });
            $.fancybox(arr, {
                'autoScale': true,
                'transitionIn': 'elastic',
                'transitionOut': 'elastic',
                'speedIn': 500,
                'speedOut': 300,
                'autoDimensions': true,
                'centerOnScroll': true,
            });
        });
    });
</script>
