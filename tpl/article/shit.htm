<link rel="stylesheet" type="text/css" href="/js/plugins/sliderPro/css/slider-pro.min.css" media="screen"/>

<script type="text/javascript" src="/js/plugins/sliderPro/js/jquery.sliderPro.min.js"></script>

<style>
    .sp-left-thumbnails.sp-has-pointer .sp-selected-thumbnail:after {
        border-left: 13px solid #0ca9ee;
    }
    .sp-bottom-thumbnails.sp-has-pointer .sp-selected-thumbnail:after {
        border-bottom: 13px solid #0ca9ee;
    }
    .sp-left-thumbnails.sp-has-pointer .sp-selected-thumbnail:before {
        border-left: 5px solid #0ca9ee;
    }
    .sp-bottom-thumbnails.sp-has-pointer .sp-selected-thumbnail:before {
        border-bottom: 5px solid #0ca9ee;
    }
    .sp-image.sp-thumbnail-image {
        height: 100%!important;
        width: 100%!important;
        display: block!important;
        margin: 0 auto!important;
    }
</style>

<div id="example5" class="slider-pro">
    <div class="sp-slides">
        {images_slide}
    </div>
    <div class="sp-thumbnails">
        {images_thumbnail}
    </div>
</div>

<script type="text/javascript">
    $( document ).ready(function( $ ) {
        $( '#example5' ).sliderPro({
            width: 700,
            height: 500,
            orientation: 'vertical',
            loop: false,
            arrows: true,
            buttons: false,
            thumbnailsPosition: 'left',
            thumbnailPointer: true,
            imageScaleMode: '{scale_mode}',
            thumbnailWidth: 100,
            fullScreen: true,
            shuffle: false,
            smallSize: 500,
            mediumSize: 1000,
            largeSize: 3000,
            fade: true,
            autoplay: false,
            thumbnailArrows: true,
            breakpoints: {
                800: {
                    thumbnailsPosition: 'bottom',
                    thumbnailWidth: 120,
                    thumbnailHeight: 120
                },
                500: {
                    thumbnailsPosition: 'bottom',
                    thumbnailWidth: 80,
                    thumbnailHeight: 80
                }
            }
        });
    });
</script>
