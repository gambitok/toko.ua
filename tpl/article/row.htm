<style>
    .buy-form {
        display: block;
        width: 100%;
    }
    .buy-form__button .btn-buy {
        float: unset;
    }
    .buy-form__button {
        display: block;
    }
    .buy-form__button-hidden {
        display: none;
    }
    .buy-form__input {
        display: block;
    }
    .buy-form__input-hidden {
        display: none;
    }
    .article-info-row__col .input-group {
        max-width: 100%;
    }
</style>

<div class="article-info-row">
    <div class="article-info-row__col">
        <div class="article-info-row__bold">{art_price}</div>
        <div class="article-info-row__upper">{art_cur}</div>
    </div>
    <div class="article-info-row__col article-info-row__col-right">
        <div class="buy-form">
            <input type="hidden" value="{article_card_basket_id}" id="basket_id">
            <div class="buy-form__button {buy_class_btn}">
                <div class="btn btn-info btn-buy" id="article-btn-buy" onclick="moveBasketButton();">
                    <span>{buy_cap}</span>
                </div>
            </div>
            <div class="buy-form__input {buy_class_input}">
                <input class="count_amount" type="number" value="{article_card_amount}" min="1" title="amount" id="count_1" >
                <div class="text-center">{count_in_basket}</div>
            </div>
        </div>

        <div itemprop="offers" itemtype="https://schema.org/Offer" itemscope class="dnone">
            <link itemprop="url" href="{page_product_link}" />
            <meta itemprop="availability" content="https://schema.org/InStock" />
            <meta itemprop="priceCurrency" content="{art_cur}" />
            <meta itemprop="itemCondition" content="https://schema.org/UsedCondition" />
            <meta itemprop="price" content="{art_price}" />
            <meta itemprop="priceValidUntil" content="2021-01-01" />
            <div itemprop="seller" itemtype="http://schema.org/Organization" itemscope>
                <meta itemprop="name" content="TOKO.ua" />
            </div>
        </div>

    </div>
</div>
<div class="article-info-row article-info-row-wrap">
    <div class="article-info-row__text">
        {storage_info}: {art_del}
    </div>
    <div class="article-info-row__text">
        {available_cap}: <span class="article-info-row__stock">{art_stock} {amount_abbr}.</span>
    </div>

    <div itemprop="offers" itemtype="http://schema.org/AggregateOffer" itemscope class="dnone">
        <meta itemprop="url" href="{page_product_link}" />
        <meta itemprop="availability" content="https://schema.org/InStock" />
        <meta itemprop="priceCurrency" content="{art_cur}" />
        <meta itemprop="itemCondition" content="https://schema.org/UsedCondition" />
        <meta itemprop="price" content="{art_price}" />
        <span itemprop="lowPrice">{art_price}</span>
        <span itemprop="highPrice" class="dnone">{art_price}</span>
        <span itemprop="offerCount">{art_stock}</span>
        <meta itemprop="availability" content="http://schema.org/SoldOut" />
    </div>

</div>

<div class="article-info-row">
    <div class="input-group">
        <input
            id="input_phone_article" class="form-control masked-phone input-buy-min" type="tel" name="phone"
            placeholder="+38(___) ___-__-__"
            title="{input_valid_phone}" value="{user_phone}"
        >
        <div class="input-group-append">
            <button class="btn btn-info btn-buy btn-buy-min" id="make_order_fast" {disabled} onclick="finishFastOrder('input_phone_article',1);">{make_order_fast}</button>
        </div>
    </div>
</div>

<script>

    $(document).ready(function() {
        $("#count_1").inputSpinner();

        $(".buy-form__input > .count_amount").each(function(  ) {
            $(this).next().find(".btn-decrement").on('click touchstart', function() {
                updateBasketCount(0);
            });
            $(this).next().find(".btn-increment").on('click touchstart', function() {
                updateBasketCount(1);
            });
            $(this).next().find("input[type='text']").on('click touchstart', function() {
                updateBasketCountChange();
            });

        });

    });

</script>
