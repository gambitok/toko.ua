<div class="proposed-card">
    <div class="proposed-card-row">
        <div class="proposed-card__image">
            <img class="lazy" data-src="{image}" src="/images/no_photo_min.png" alt="{name}">
        </div>
    </div>
    <div class="proposed-card-row">
        <div class="proposed-card__text">
            <a itemprop="url" href="{page_proposed_link}">
                {name} {brand_name} {article_nr_displ}
            </a>
        </div>
    </div>
    <div class="proposed-card-row">
        <div class="proposed-card__price">
            {price} {currency}
        </div>
        <div class="proposed-card__buy">
            <button class="btn-group btn btn-sm btn-info" onclick="{basket}">
                <span>{buy_cap}</span>
            </button>
        </div>
    </div>
</div>
