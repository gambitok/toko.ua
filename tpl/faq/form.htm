<p class="faq-title">
    {popular_question}
</p>
<div class="faq">
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-1" name="faq-tab-1">
        <label class="faq-label" for="faq-tab-1">
            {faq_question_1}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_1}</span>
            {help_form}
        </div>
    </div>
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-2" name="faq-tab-2">
        <label class="faq-label" for="faq-tab-2">
            {faq_question_2}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_2}</span>
        </div>
    </div>
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-3" name="faq-tab-3">
        <label class="faq-label" for="faq-tab-3">
            {faq_question_3}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_3}</span>
            <div style="margin-top: 15px;">
                {form_request}
            </div>
        </div>
    </div>
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-4" name="faq-tab-4">
        <label class="faq-label" for="faq-tab-4">
            {faq_question_4}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_4}</span>
        </div>
    </div>
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-5" name="faq-tab-5">
        <label class="faq-label" for="faq-tab-5">
            {faq_question_5}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_5}</span>
        </div>
    </div>
    <div class="faq-tab">
        <input type="checkbox" id="faq-tab-6" name="faq-tab-6">
        <label class="faq-label" for="faq-tab-6">
            {faq_question_6}?
        </label>
        <div class="faq-content">
            <span>{faq_answer_6}</span>
        </div>
    </div>
</div>

<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [{
            "@type": "Question",
            "name": "{faq_question_1}",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "{faq_answer_1}"
            }
        }, {
            "@type": "Question",
            "name": "{faq_question_2}",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "{faq_answer_2}"
            }
        }, {
            "@type": "Question",
            "name": "{faq_question_3}",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "{faq_answer_3}"
            }
        }]
    }
</script>
