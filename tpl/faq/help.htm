<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="modal-help">

                <div class="modal-help-row">
                    <span class="modal-help-row__circle">1</span>
                    <span class="modal-help-row__text">{help_modal_call_now}</span>

                    <ul class="modal-help-row-phones">
                        <li>
                            <img data-src="/images/phones/kyivstar.png" class="lazy" alt="kyivstar" src="/images/no_photo.svg">
                            <a href="tel:0970803060">(097) 080 30 60</a>
                        </li>
                        <li>
                            <img data-src="/images/phones/vodafone.png" class="lazy" alt="vodafone" src="/images/no_photo.svg">
                            <a href="tel:0500803060">(050) 080 30 60</a>
                        </li>
                        <li>
                            <img data-src="/images/phones/lifecell.png" class="lazy" alt="lifecell" src="/images/no_photo.svg">
                            <a href="tel:0930803060">(093) 080 30 60</a>
                        </li>
                    </ul>
                </div>

                <div class="modal-help-row">
                    <span class="modal-help-row__circle">2</span>
                    <span class="modal-help-row__text">{help_modal_call}</span>

                    <div class="modal-help-row-call">
                        <input id="faq-phone" title="{phone_cap}" class="form-control masked-phone" type="tel" placeholder="+38(___) ___-__-__">
                        <button id="btn_set_client_request_faq" class="btn btn-primary"  onclick="setClientRequestFaq();">{help_modal_call_me}</button>
                    </div>
                </div>

                <div class="modal-help-row">
                    <span class="modal-help-row__circle">3</span>
                    <span class="modal-help-row__text">{help_modal_mess}</span>

                    <div class="modal-help-row-socials">
                        <a onclick="showTelegramForm();" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                            <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__telegram">
                                <img src="/images/icons/socials/png/telegram.png" alt="Telegram">
                            </div>
                            <span>Telegram</span>
                        </a>
                        <a onclick="showViberForm();" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                            <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__viber">
                                <img src="/images/icons/socials/png/viber.png" alt="Viber">
                            </div>
                            <span>Viber</span>
                        </a>
                        <a href="http://m.me/tokogroup" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                            <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__facebook">
                                <img src="/images/icons/socials/png/facebook.png" alt="Facebook">
                            </div>
                            <span>Messenger</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
