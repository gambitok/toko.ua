<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(999) 999-99-99", {
            placeholder:"+38(___) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
        $(".masked-vin").mask("*****************", {
            placeholder:"_______________",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<div id="request-card" class="request">
    <div class="request-row request-row-mob request-row-mob-main">
        <a onclick="$('#VinFormPhone').modal('show');">
            <div class="request-row__image"><img class="lazy" src="/images/no_photo_min.png" data-src="/images/icons/faq/vin-icon.png" alt="Icon"></div>
            <div class="request-row__title">
                <span style="color: #0CA9EE;">{faq_request_title}</span><br>
                <span style="color: #36cd76;">{faq_request_title2}</span>
            </div>
        </a>
    </div>
    <div class="request-row">
        <div class="request-row__image"><img class="lazy" src="/images/no_photo_min.png" data-src="/images/icons/faq/vin-icon.png" alt="Icon"></div>
        <div class="request-row__title">
            <span style="color: #0CA9EE;">{faq_request_title}</span><br>
            <span style="color: #36cd76;">{faq_request_title2}</span>
        </div>
    </div>
    <div class="request-row">
        <input id="help-phone-2" class="masked-phone" type="tel" placeholder="{phone_cap}">
    </div>
    <div class="request-row">
        <input id="help-vin-2" class="masked-vin" type="text" placeholder="{vin_cap}">
    </div>
    <div class="request-row">
        <textarea id="help-text-2" placeholder="{spare_parts_list}"></textarea>
    </div>
    <div class="request-row">
        <button id="btn_set_client_request_card" class="btn btn-primary"  onclick="setClientRequestCard();">{send_seller}</button>
    </div>
    <div class="request-row">
        <div class="request-row__text" style="text-align: left;">
            <span>{faq_request_about}</span>
            <a onclick="$('#VinForm').modal('show');">{faq_request_about2}</a>
        </div>
    </div>
</div>

<div id="VinForm" class="modal fade modal-gallery" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <img alt="image" class="lazy" data-src="/images/icons/faq/techpassport.jpg" src="/images/no_photo_min.png" style="max-width: 100%;">
            </div>
        </div>
    </div>
</div>
