<div id="request-done" class="reqeust-card reqeust-card-done" style="text-align: center;">
    <div class="request-done-row request-done-image" style="margin-top: 15px;">
        <i class="fa fa-check-circle" style="font-size: 120px; color: #36cd76"></i>
    </div>
    <div class="request-done-row request-done-title" style="margin-top: 15px;">
        <span style="font-size: 20px; font-weight: bold; color: #36cd76">{done_cap}!</span>
    </div>
    <div class="request-done-row request-done-text" style="margin-top: 15px;">
        <span style="font-size: 16px; font-weight: bold; color: #606975">{manager_call_cap}</span>
    </div>
</div>
