<div class="home">
    <div class="container">
        <div class="row">

            <h2>{start_from_car}:</h2>
            <h3>{start_from_car2}</h3>
            <div class="home-cars">
                {catalogue_tab_search}
            </div>

            <div class="home-banner">
                {catalogue_banner}
            </div>

            <h2>{professional_catalogs}</h2>
            <div class="home-products">
                {select_group}
            </div>

            <h2>{spare_parts_catalog_cap}</h2>
            <div class="home-catalog">
                {select_det_group}
            </div>

            <h2>{auto_parts_catalog_cap}</h2>
            <div class="home-seo">
                <div class="form-toggle">
                    <!--Header-->
                    <div>
                        <label for="form-toggle-2">
                            <a class="rotate" onclick="rotateIcon(this)">{more_read} <i class="fa fa-chevron-down rotate__animation"></i></a>
                        </label>
                    </div>
                    <!--Checker-->
                    <input type="checkbox" id="form-toggle-2">
                    <!--Block-->
                    <div>
                        <div class="metro">
                            <h1>{auto_search}</h1>
                            {select_auto_group}
                        </div>
                    </div>
                </div>
            </div>

            <h2>{recommendations_parts}</h2>
            <div class="home-recommend">
                <div class="form-toggle">
                    <!--Header-->
                    <div>
                        <label for="form-toggle-1">
                            <a class="rotate" onclick="rotateIcon(this)">{more_read} <i class="fa fa-chevron-down rotate__animation"></i></a>
                        </label>
                    </div>
                    <!--Checker-->
                    <input type="checkbox" id="form-toggle-1">
                    <!--Block-->
                    <div>
                        {select_recommendations}
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
