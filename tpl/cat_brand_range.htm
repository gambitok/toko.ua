<div class="row side-brands">
    <div class="col-7 side-brands__text">
        <label class="container_check">{val_brand}
            <input value="{val_brand}" id="brand_{brand_id}" name="{brand_id}" type="checkbox" class="check-brand {main_brand_class}" onClick="{jsFilterModel}" {checked}>
            <span class="checkmark"></span>
        </label>
    </div>
    <div class="col-5 side-brands__price">
        <span>{from_cap} {min_price} {currency_cap}</span>
    </div>
</div>
