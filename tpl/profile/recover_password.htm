<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(999) 999-99-99", {
            placeholder:"+38(___) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<div class="content">
    <h1>{recover_pass}</h1>
    <div id="recover_block" class="row">
        <div class="col-12">
            <span>{set_pass_recover}</span>
        </div>
        <div class="col-6">
            <input id="recover_phone" title="{phone_cap}" class="form-control masked-phone" type="tel" placeholder="+38(___) ___-__-__">
        </div>
        <div class="col-6">
            <button class="btn btn-primary" onclick="recoverPassword();">{send_sms}</button>
        </div>
    </div>
</div>
