<link rel="stylesheet" href="/js/plugins/select2/select2.min.css" />
<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(999) 999-99-99", {
            placeholder:"+38(___) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<style>
    input:disabled {
        background-color: #eee;
        cursor: default;
    }
    .not-valid {
        border: 1px solid red!important;
    }
    .accept-valid {
        border: 1px solid limegreen!important;
    }
    .btn-valid {
        background: limegreen;
        color: white;
    }
    .select2-selection__rendered {
        line-height: 46px !important;
    }
    .select2-container .select2-selection--single {
        height: 46px;
        border: 1px solid #dadada;
    }
    .select2-selection__arrow {
        height: 46px !important;
    }
</style>

<div class="content">
	<div class="container">
		<div class="registration">

			<div class="row align-items-center ">
				<div class="col-lg-12 col-12 pad0">
					<h1>{registration}</h1>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{name_surname}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<input id="reg_name" title="{name_surname}" class="form-control" type="text">
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{phone_cap}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<input id="reg_phone" title="{phone_cap}" class="form-control masked-phone" type="tel" placeholder="+38(___) ___-__-__">
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label>{email_cap}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<input id="reg_email" title="{email_cap}" class="form-control" type="email">
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{client_password_cap}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<input id="reg_password" name="reg_password" title="{client_password_cap}" class="form-control" type="password">
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{repeat_password}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<input id="reg_repassword" title="{repeat_password}" class="form-control" type="password">
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{client_category}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<select id="reg_category" title="{client_category}" class="form-control">
						{category_options}
					</select>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{choose_office_near}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">
					<select id="reg_tpoint" title="{choose_office}" class="form-control">
						{tpoint_options}
					</select>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-4 col-12 pad0">
					<label class="label-required">{location_cap}:</label>
				</div>
				<div class="col-lg-8 col-12 pad0">

					<select id="user_city" title="{location_cap}" class="form-control" data-attr="select" oninput="getCityVal();" onchange="setCityVal();">
                        <option value="0">{not_chosen}</option>
                        {user_city_main_list}
					</select>

                    <select style="display: none!important;" class="orders-block-row__input" name="user_city_np" id="user_city_np" data-attr="select" title="NovaPoshta">
                        <option value="0">{not_chosen}</option>
                    </select>

					<div class="float-left city-inline">
						<ul class="list-inline">
							<li class="list-inline-item">{for_example}:</li>
							<li class="list-inline-item"><button id="10108" class="js-programmatic-set-val button" onclick="triggerCity(this);"> {city_kyiv} </button></li>
							<li class="list-inline-item"><button id="22739" class="js-programmatic-set-val button" onclick="triggerCity(this);"> {city_kharkiv} </button></li>
							<li class="list-inline-item"><button id="13549" class="js-programmatic-set-val button" onclick="triggerCity(this);"> {city_lviv} </button></li>
							<li class="list-inline-item"><button id="4074" class="js-programmatic-set-val button" onclick="triggerCity(this);"> {city_dnepr} </button></li>
						</ul>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-12 col-12 pad0">
					<label class="container_check">{mailing_cap}
						<input id="reg_mailing" value="{mailing_cap}" name="{mailing_cap}" type="checkbox" checked="checked">
						<span class="checkmark"></span>
					</label>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-12 col-12 pad0">
					<input type="submit" class="btn btn-primary" value="{save_cap}" onclick="saveRegistrationForm();">
				</div>
			</div>

		</div>
	</div>
</div>

<script type="text/javascript" src="/js/plugins/select2/select2.city.min.js"></script>

<script>
    var $example = $("#user_city").select2({
        language: "ru"
    });

    $('.select2-delivery').select2({
        minimumResultsForSearch: -1
    });

    $('.select2-payment').select2({
        minimumResultsForSearch: -1
    });

    setTimeout(function () {
        $("#user_city").select2();
    }, 1500);
</script>


<script>
    function triggerCity(a) {
        sendSelect2('',true,a);
    }

    function sendSelect2(city_like,trig,a) {
        JsHttpRequest.query(folder,{'w':'get_city_list', 'city_like':city_like},
            function (result, errors){ if (errors) {alert(errors);} if (result){
                $("#select_city").append(result.content);
                var mas=result.content;
                var len = Object.keys(mas).length;
                for (var i=1; i<=len; i++) {
                    var id_city=Object.entries(mas[i])[0][1];
                    var value_city=Object.entries(mas[i])[1][1];
                    addOption(id_city,value_city);
                }
                $(".select2-city").select2('open');
                if (trig===true) {
                    var city = $(a).attr('id');
                    $example.val(city).trigger("change");
				}
            }}, true);
    }

    function addOption(id_city,value_city) {
        if ($('.select2-city').find("option[value='" + id_city + "']").length) {
            $('.select2-city').val(id_city).trigger('change');
        } else {
            var newOption = new Option(value_city, id_city, false, false);
            $('.select2-city').append(newOption).val(id_city).trigger('change');
        }
    }
</script>
