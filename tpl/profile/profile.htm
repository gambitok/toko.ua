<div class="row profile">

	<div class="col-lg-2 col-12 profile-side">
		<div class="side-menu">
			<h1>{profile} ID #{client_id}:</h1>
			<h2 class="bold">{client_name}</h2></br>
            <ul class="nav nav-tabs" id="myTab" role="tablist" style="flex-direction: column;">
                <li class="nav-item">
                    <a class="nav-link {profile-account}" onclick="showProfileAccount();" id="home-tab" data-toggle="tab" href="#profile-home" role="tab" aria-controls="profile-home" aria-selected="true"><span class="fas fa-user-circle"></span> {my_office}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {profile-orders}" onclick="showProfileOrders();" id="profile-tab" data-toggle="tab" href="#profile-orders" role="tab" aria-controls="profile-orders" aria-selected="false"><span class="fas fa-history"></span> {orders}</a>
                </li>
                <li class="nav-item {check_visible}">
                    <a class="nav-link {profile-check}" onclick="showProfileCheckForm();" id="check-tab" data-toggle="tab" href="#profile-check" role="tab" aria-controls="profile-check" aria-selected="false"><span class="fas fa-credit-card"></span> {check_profile}</a>
                </li>
                <li class="nav-item {price_visible}">
                    <a class="nav-link {profile-price}" onclick="showProfilePrice();" id="price_list-tab" data-toggle="tab" href="#profile-price_list" role="tab" aria-controls="profile-price_list" aria-selected="false"><span class="fas fa-money-check-alt"></span> {price_list}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onClick="logoutForm();" role="tab"><span class="fas fa-sign-out-alt"></span> {logout}</a>
                </li>
            </ul>
		</div>
	</div>

	<div class="col-lg-10 col-12 profile-main">
		<div class="content profile-main-form">
			<div class="tab-content">

				<div class="tab-pane {profile-account}" id="profile-home" role="tabpanel" aria-labelledby="home-tab">
					<div class="container" style="max-width: 600px">
						<div class="row">
							<div class="col-12">
								<h2>{my_office}</h2>
							</div>
						</div>
						<div class="row">
							<div class="col-12">
								<div id="profile_account">
									{profile_account}
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="tab-pane {profile-orders}" id="profile-orders" role="tabpanel" aria-labelledby="profile-tab">
                    <div class="container">
                        <div class="row align-items-center">
                            <div class="col-12"><h2>{orders}</h2></div>
                        </div>
                        <div class="row align-items-center">
                            <div id="radio-group" class="col-12 radio-group">
                                <input id="radio_orders" type="radio" name="cur" checked="checked" onclick="showProfileOrders();" title="{orders}">
                                <label for="radio_orders" title="{orders}"><span class="fa fa-folder"></span></label>
                                <input id="radio_orders_arts" type="radio" name="cur" onclick="showProfileOrdersArts('','');" title="{orders_arts}">
                                <label for="radio_orders_arts" title="{orders_arts}"><span class="fa fa-folder-open"></span></label>
                            </div>
                            <div class="col-12">
                                <br>
                                <div id="profile_orders">
                                    {profile_orders}
                                </div>
                            </div>
                        </div>
                    </div>
				</div>

				<div class="tab-pane {profile-check}" id="profile-check" role="tabpanel" aria-labelledby="check-tab">
                    <div class="container">
                        <div class="row align-items-center">
                            <div class="col-12"><h2>{check_profile}</h2></div>
                        </div>
                        <div class="row align-items-center {check_visible}">
                            <div class="col-12">
                                <div class="row">
                                    <div class="col-12 col-lg-5">
                                        <label for="saldo_data_start">{date_cap} {from_cap}:</label>
                                        <input title="{date_cap}" type="date" class="form-control" id="saldo_data_start" value="{date_saldo_from}">
                                    </div>
                                    <div class="col-12 col-lg-5">
                                        <label for="saldo_data_end">{date_cap} {to_cap}:</label>
                                        <input title="{date_cap}" type="date" class="form-control" id="saldo_data_end" value="{date_saldo_to}">
                                    </div>
                                    <div class="col-12 col-lg-2">
                                        <label>&nbsp;</label><br>
                                        <button class="btn btn-primary" onclick="showProfileCheckForm()"><span class="fa fa-filter"></span> {filter_cap}</button>
                                    </div>
                                </div>
                                <br>
                                <div id="check_block">
                                    {profile_check}
                                </div>
                            </div>
                        </div>
					</div>
				</div>

				<div class="tab-pane {profile-price}" id="profile-price_list" role="tabpanel" aria-labelledby="price_list-tab">
                    <div class="container">
                        <div class="row align-items-center">
                            <div class="col-12">
                                <h2>{price_list}</h2>
                            </div>
                        </div>
                        <div class="row align-items-center {price_visible}">
                          <div class="col-12">
                              <div id="profile_file_list">
                                  {profile_file_list}
                              </div>
                          </div>
                        </div>
				    </div>
				</div>

			</div>
		</div>
	</div>

</div>
