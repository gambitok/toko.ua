<script>
    $(document).ready(function(){
        $("#input_phone").val($("#true_phone").val());
        $(".masked-phone").mask("+38(999) 999-99-99", {
            placeholder:"+38(___) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<div class="registration">

    <div class="registration-row">
        {bonus_user}
    </div>

    <div class="registration-row">
        <div class="row">
            <div class="col-lg-4 col-12">
                <label class="label-required">{phone_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_phone" title="{phone_cap}" class="form-control masked-phone" type="tel" placeholder="+38(___) ___-__-__" value="{client_phone}" disabled>
            </div>
        </div>
    </div>

    <div class="registration-row">
        <div class="row">
            <div class="col-lg-4 col-12">
                <label class="label-required">{client_password_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_password" title="{client_password_cap}" class="form-control" type="password" value="{client_password}" onkeydown="closeDisablesButton();">
                <div style="text-align: right; margin-top: 15px;">
                    <input id="show_pass" name="show_pass" checked type="checkbox" onclick="togglePass(this);">
                    <label for="show_pass">{show_pass}</label>
                </div>
            </div>
        </div>
    </div>

    <div class="registration-row">
        <div class="row">
            <div class="col-lg-4 col-12">
                <label>{email_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_email" title="{email_cap}" class="form-control" type="text" value="{client_email}" onkeydown="closeDisablesButton();">
            </div>
        </div>
    </div>

    <div class="registration-row">
        <div class="row">
            <div class="col-lg-4 col-12">
                <label class="label-required">{full_name_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_name" title="{full_name_cap}" class="form-control" type="text" value="{client_name}" onkeydown="closeDisablesButton();">
            </div>
        </div>
    </div>

    <div class="registration-row">
        <input id="submit_profile_update" type="submit" class="btn btn-primary" value="{save_cap}" onclick="saveProfileForm();" disabled>
    </div>

</div>

<script>
    function closeDisablesButton() {
        $("#submit_profile_update").prop("disabled", false);
    }
</script>
