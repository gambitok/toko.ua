<div id="check_block">

    <h5>{balance_cap}: {saldo_end_data}</h5>
    <br>
    <div class="table-responsive">
    <table id="table_check" class="table" style="width:100%">
        <thead>
            <tr>
                <th>#</th>
                <th>{date_cap}</th>
                <th>{currency}</th>
                <th>{reminder_to}</th>
                <th>{debit_cap}</th>
                <th>{credit_cap}</th>
                <th>{reminder_after}</th>
                <th>{document_cap}</th>
                <th>{payment_summ}</th>
            </tr>
        </thead>
        <tbody>
            {profile_check_range}
        </tbody>
    </table>
    </div>
</div>
