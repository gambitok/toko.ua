<table id="orders-table" class="table table-striped table-bordered table-responsive" style="width:100%">
    <thead>
        <tr>
            <td>#</td>
            <td>{recipient_cap}</td>
            <td>{date_cap}</td>
            <td>{city_cap}</td>
            <td>{delivery_cap}</td>
            <td>{payment_cap}</td>
            <td>{summ_cap}</td>
            <td>{currency}</td>
            <td>{status_cap}</td>
        </tr>
    </thead>
    <tbody>
        {orders_range}
    </tbody>
</table>
