<a class="proposed-card" itemprop="url" href="{page_link}">
    <div class="proposed-card-row">
        <div class="proposed-card__image">
            <img class="lazy" data-src="{image}" src="/images/no_photo_min.png" alt="{brand_name}">
        </div>
    </div>
    <div class="proposed-card-row" style="text-align: center; display: block;">
        <div class="proposed-card__text">
            <span>{brand_name}</span>
        </div>
    </div>
</a>
