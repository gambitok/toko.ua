<link rel="stylesheet" href="/captcha/css/style.css">

<script type='text/javascript'>
    function refreshCaptcha(){
        let img = document.images['captchaimg'];
        img.src = img.src.substring(0,img.src.lastIndexOf("?"))+"?rand="+Math.random()*1000;
    }
</script>

<style>
    label.alert-danger {
        padding: 15px;
        display: block;
        margin-bottom: 15px;
    }
</style>

<div class="content">
    {message}

    <h1>{captcha_cap}</h1>
    <br>
    <form action="" method="post" name="form1" id="form1" class="table_captcha">
        <input name="reg_phone" type="hidden" value="{reg_phone}">
        <input name="reg_name" type="hidden" value="{reg_name}">
        <input name="reg_email" type="hidden" value="{reg_email}">
        <input name="reg_password" type="hidden" value="{reg_password}">
        <input name="reg_category" type="hidden" value="{reg_category}">
        <input name="reg_tpoint" type="hidden" value="{reg_tpoint}">
        <input name="user_city" type="hidden" value="{user_city}">
        <input name="reg_mailing" type="hidden" value="{reg_mailing}">

        <p><img src="/captcha/captcha.php?rand=<?php echo rand();?>" id='captchaimg'></p>
        <br>
        <p><label for='message'>{cant_read_code}:</label></p>
        <p><input id="captcha_code" name="captcha_code" type="text" class="form-control" style="width: 300px"></p>
        <p>{click_to_refresh} <a href='javascript: refreshCaptcha();'>{here_cap}</a>.</p>
        <br>
        <p><input name="Submit" type="submit" value="{send_sms}" class="btn btn-primary" style="width: 300px"></p>
    </form>
</div>
