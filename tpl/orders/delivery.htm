<div class="orders-block-row orders-block-row-delivery" data-tab-delivery="1">
    <label class="orders-block-row__radio">{delivery_type_1}
        <input type="radio" name="user_delivery" data-tab-href="tab-1" data-id-delivery="1" checked>
        <span class="radio-mark"></span>
    </label>
        <div class="orders-block-row-hidden orders-block-row-display" id="tab-1">
        <b>{closest_address}: </b><label>{tpoint_address}</label>
    </div>
</div>
