<div class="orders-block-row orders-block-row-delivery {delivery_status_1}" data-tab-delivery="1">
        <label class="orders-block-row__radio">{delivery_text_1} {delivery_free_1}
        <input type="radio" name="user_delivery" data-tab-href="tab-1" data-id-delivery="1">
        <span class="radio-mark"></span>
    </label>
    <div class="orders-block-row-hidden" id="tab-1">
        <b>{closest_address}: </b><label id="tpoint_address"></label>
    </div>
</div>

<div class="orders-block-row orders-block-row-delivery {delivery_status_2}" data-tab-delivery="2">
    <label class="orders-block-row__radio">{delivery_text_2} {delivery_free_2}
        <input type="radio" name="user_delivery" data-tab-href="tab-2" data-id-delivery="2">
        <span class="radio-mark"></span>
    </label>
    <div class="orders-block-row-hidden" id="tab-2">
        <b>{chosen_city}: </b><label class="chosen-city">{city_cap}</label>
        <div class="orders-block-row-input-group">
            <input name="street" class="orders-block-row__input" type="text" placeholder="{street_cap}">
            <input name="house" class="orders-block-row__input orders-block-row__input-min" type="text" placeholder="{house_cap}">
            <input name="porch" class="orders-block-row__input orders-block-row__input-min" type="text" placeholder="{entrance_cap}">
        </div>
    </div>
</div>
