<link rel="stylesheet" href="/js/plugins/select2/select2.min.css" />

<script>
    $(document).ready(function(){
        $(".masked-phone").mask("+38(099) 999-99-99", {
            placeholder:"+38(0__) ___-__-__",
            autoclear: false,
            alias: "numeric"
        });
    })
</script>

<style>
    .not-valid {
        border: 1px solid red;
    }
    .accept-valid {
        border: 1px solid limegreen;
    }
    .btn-valid {
        background: limegreen;
        color: white;
    }
</style>

<style>
    .select2-selection__rendered {
        line-height: 46px !important;
    }
    .select2-container .select2-selection--single {
        height: 46px !important;
    }
    .select2-selection__arrow {
        height: 46px !important;
    }
</style>

<div class="orders">

    <div class="orders-block">

        <div class="orders-block-row">
            <div class="orders-block-row-title">
                <label class="orders-block-row__label" for="user_name">{name_surname}</label>
            </div>
            <div class="orders-block-row-content">
                <input class="orders-block-row__input valid_field" type="text" name="user_name" id="user_name" data-attr="text" placeholder="{name_surname}">
            </div>
        </div>
        <div class="orders-block-row">
            <div class="orders-block-row-title">
                <label class="orders-block-row__label" for="user_phone">{phone_number}</label>
            </div>
            <div class="orders-block-row-content">
                <input class="orders-block-row__input masked-phone valid_field" type="tel" placeholder="+38(0__) ___-__-__" name="user_phone" id="user_phone" data-attr="phone">
            </div>
        </div>
        <div class="orders-block-row">
            <div class="orders-block-row-title">
                <label class="orders-block-row__label" for="user_city">{city_cap}</label>
            </div>
            <div class="orders-block-row-content">
                <select class="orders-block-row__input valid_field" name="user_city" id="user_city" data-attr="select">
                    <option value="0">{not_chosen}</option>
                    <option value="1">Kyiv</option>
                    <option value="2">Kmelnitskii</option>
                </select>
            </div>
        </div>
    </div>
    <div class="orders-title">
        <span>{contacts_cap}</span>
    </div>

    <div class="orders-block">
        {order_delivery}
    </div>
    <div class="orders-title">
        <span>{delivery_cap}</span>
    </div>

    <div class="orders-block">
        {order_payment}
    </div>
    <div class="orders-title">
        <span>{payment_cap}</span>
    </div>

    <div class="orders-block">
        <div class="orders-block-row">
            <div class="orders-block-row-title">
                <label class="orders-block-row__label" for="user_email">{user_email_cap}</label>
            </div>
            <div class="orders-block-row-content">
                <input class="orders-block-row__input" type="email" name="user_email" id="user_email" placeholder="{user_email_cap}">
            </div>
        </div>
        <div class="orders-block-row">
            <div class="orders-block-row-title">
                <label class="orders-block-row__label" for="user_comment">{user_comment_cap}</label>
            </div>
            <div class="orders-block-row-content">
                <textarea class="orders-block-row__input" name="user_comment" id="user_comment" placeholder="{user_comment_cap}"></textarea>
            </div>
        </div>
    </div>
    <div class="orders-title">
        <span>{info_cap}</span>
    </div>

    <div class="orders-footer">
        <div class="orders-footer-about">
            <span>{delivery_user_info}</span>
        </div>
        <div class="orders-footer-button">
            <button onclick="validFields();" id="valid_button">{make_order_cap}</button>
        </div>
    </div>

</div>

<script type="text/javascript" src="/js/plugins/select2/select2.min.js"></script>
<script type="text/javascript" src="/js/plugins/select2/select2_ru.js"></script>

<script>

    $(document).ready(function() {
        $("select").each(function() {
            $(this).select2({language: "ru"});
            $($(this).select2("container")).addClass("orders-block-row__input");
        });
    });

    function getPhone(str) {
        str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");str = str.replace("_", "");
        str = str.replace("-", "");
        str = str.replace("-", "");
        str = str.replace("+", "");
        str = str.replace("(", "");
        str = str.replace(")", "");
        str = str.replace(" ", "");
        return str;
    }

    function validFields() {
        let valid=0;
        $(".valid_field").each(function() {
            let data_attr = $(this).attr("data-attr");

            // INPUT TEXT FIELD
            if (data_attr==="text") {
                if ($(this).val()==="") {
                    valid++;
                    $(this).addClass("not-valid");
                    $(this).removeClass("accept-valid");
                } else {
                    $(this).addClass("accept-valid");
                    $(this).removeClass("not-valid");
                }
            }

            // INPUT PHONE FIELD
            if (data_attr==="phone") {
                let phone = getPhone($(this).val());
                if (phone.length!==12) {
                    valid++;
                    $(this).addClass("not-valid");
                    $(this).removeClass("accept-valid");
                } else {
                    $(this).addClass("accept-valid");
                    $(this).removeClass("not-valid");
                }
            }

            // SELECT FIELD
            if (data_attr==="select") {
                if ($("#" + $(this).attr("id") + " option:selected").val()==="0") {
                    valid++;
                    $(this).addClass("not-valid");
                    $(this).removeClass("accept-valid");
                } else {
                    $(this).addClass("accept-valid");
                    $(this).removeClass("not-valid");
                }
            }

            if ($(this).hasClass("not-valid")) {
                $(this).addClass("tooltips");
                $(this).attr("title", "{check_the_data}");
                $(this).attr("data-toggle", "tooltip");
                $(this).attr("data-placement", "right");
                $(this).tooltip();
                $(this).tooltip("show");
            } else {
                $(this).removeClass("tooltips");
                $(this).attr("title", "");
                $(this).tooltip("dispose");
            }
        });
        if (valid===0) {
            $("#valid_button").addClass("btn-valid");
        } else {
            $("#valid_button").removeClass("btn-valid");
        }
    }
</script>
