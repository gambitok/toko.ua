    <div class="select3">
        <label id="select3-label" class="select3-selected" for="select3">{selected_name}</label>
        <input id="select3-selected" type="hidden" data-id="{selected_id}">
        <input type="checkbox" id="select3">
        <div class="select3-form">
            <div class="select3-search">
                <input type="text" id="select3-search" onkeyup="searchCity()" placeholder="{search_cap}.." title="{search_cap}..">
            </div>
            <ul id="select3-list" class="select3-list">
                {select_list}
            </ul>
        </div>
    </div>
</div>

    function searchCity() {
        let text = $("#select3-search").val();
        let len  = text.length;
        if (len === 0) {
            JsHttpRequest.query(folder, {'w': 'searchCityMain'},
                function (result, errors) {
                    if (errors) {
                        alert(errors);
                    }
                    if (result) {
                        $("#select3-list").html(result.content);
                    }
                }, true);
        }

        if (len > 2) {
            JsHttpRequest.query(folder, {'w': 'searchCity', 'text': text},
                function (result, errors) {
                    if (errors) {
                        alert(errors);
                    }
                    if (result) {
                        $("#select3-list").html(result.content);
                    }
                }, true);
        }
    }

    function selectCity(el) {
        let city_id = $(el).attr("data-id");
        let city_name = $(el).attr("data-name");
        // $(".select3-list__item").each(function () {
        //     $(this).removeClass("select3-list__item-active");
        // });
        // el.addClass("select3-list__item-active");
        $("#select3-selected").val(city_id);
        $("#select3-label").text(city_name);
        $("#select3").trigger('click');
    }
