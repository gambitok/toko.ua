<!DOCTYPE html>
<html lang="{site_lang_html}">
<head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-134334911-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-134334911-1');
        gtag('config', 'AW-1023462949');
    </script>

    {site_google_conversation}

    <title>{site_title}</title>
    <meta http-equiv="Content-Type" content="text/html" charset="windows-1251">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{site_description}">
    <meta name="keywords" content="{site_keywords}">

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="yandex" content="index, follow">
    <meta name="distribution" content="global">
    <meta name="google-site-verification" content="KA_3DBoBspAeA7v6LtjRUB9bXdPhWPcgNUvlNhZjzac" />

    <link rel="alternate" href="https://toko.ua/" hreflang="x-default" />
    <link rel="alternate" href="https://toko.ua/" hreflang="ru-ua" />
    <link rel="alternate" href="https://toko.ua/en/" hreflang="en-ua" />
    <link rel="alternate" href="https://toko.ua/uk/" hreflang="uk-ua" />

    <!--socials-->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{site_title}" />
    <meta property="og:url" content="{canonical_link}" />
    <meta property="og:description" content="{site_description}" />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:site_name" content="{internet_shop} toko.ua" />

    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png" sizes="192x192">
    <link rel="manifest" href="/manifest.json" type="text/json">

<!--    <script async src="https://www.google-analytics.com/analytics.js"></script>-->

    <link rel="canonical" href="{canonical_link}"/>

    <!--custom fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <!--fontawesome-->
    <link rel="stylesheet" href="/fonts/fontawesome_web/css/all-minify.css">
    <!--plugins styles-->
    <link rel="stylesheet" href="/css/plugins/bootstrap.min.css">
    <!--custom styles-->
    <link rel="stylesheet" href="/css/style.min.css">
    <!--plugins scripts-->
    <script type="text/javascript" src="/js/library/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="/js/library/popper.min.js"></script>
    <script type="text/javascript" src="/js/library/bootstrap.min.js"></script>
    <script type="text/javascript" src="/js/JsHttpRequest/JsHttpRequest.min.js"></script>

    <script type="text/javascript">
        var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
        (function(){
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            s1.src='https://embed.tawk.to/5f101b155b59f94722bad5c7/default';
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
        })();
    </script>
</head>

<body>

<div class="wrapper container-fluid">

    <div class="anchor-contacts">
        <div class="anchor-contacts-li anchor-contacts-li-item anchor-contacts-li-hidden tooltips" title="Online chat" data-placement="left">
            <a href="javascript:void(Tawk_API.toggle())" onclick="toggleSocialIcons()" class="anchor-contacts__item anchor-contacts__item-chats"><img src="/images/icons/socials/png/chats.png" alt="Online chat"></a>
        </div>
        <div class="anchor-contacts-li anchor-contacts-li-item anchor-contacts-li-hidden tooltips" title="Telegram" data-placement="left">
            <a onclick="showTelegramForm();" rel="noopener" target="_blank" class="anchor-contacts__item anchor-contacts__item-telegram"><img src="/images/icons/socials/png/telegram.png" alt="Telegram"></a>
        </div>
        <div class="anchor-contacts-li anchor-contacts-li-item anchor-contacts-li-hidden tooltips" title="Viber" data-placement="left">
            <a onclick="showViberForm();" rel="noopener" target="_blank" class="anchor-contacts__item anchor-contacts__item-viber"><img src="/images/icons/socials/png/viber.png" alt="Viber"></a>
        </div>
        <div class="anchor-contacts-li anchor-contacts-li-item anchor-contacts-li-hidden tooltips" title="Facebook" data-placement="left">
            <a href="http://m.me/tokogroup" rel="noopener" target="_blank" class="anchor-contacts__item anchor-contacts__item-facebook"><img src="/images/icons/socials/png/facebook.png" alt="Facebook"></a>
        </div>
        <div class="anchor-contacts-li anchor-contacts-li-main tooltips" title="{make_question}" data-placement="left">
            <a onclick="toggleSocialIcons();" class="anchor-contacts__item anchor-contacts__item-contacts"><img src="/images/icons/socials/png/chats.png" alt="Socials"></a>
        </div>
    </div>

    <header>
       <div class="container">
           <div class="row header-order">
               <div class="col-12 col-lg-3 header-order-logo">
                   <a href="/" class="btn">
                       <img itemprop="logo" src="{image_logotype}" alt="{site_title_short}" title="{site_title_short}">
                   </a>
               </div>
               <div class="col-12 col-lg-2 header-order-text">
                   <span>{need_help}</span>
               </div>
               <div class="col-12 header-phone-drop">
                   <div class="dropdown">
                       <label onclick="showPhoneForm();"><i class="fa fa-phone"></i> (097) 080 30 60</label>
                   </div>
               </div>
               <div class="col-6 col-lg-7 header-order-phone">
                   <ul>
                       <li>
                           <img data-src="/images/phones/kyivstar.png" class="lazy" alt="kyivstar">
                           <a href="tel:0970803060">(097) 080 30 60</a>
                       </li>
                       <li>
                           <img data-src="/images/phones/vodafone.png" class="lazy" alt="vodafone">
                           <a href="tel:0500803060">(050) 080 30 60</a>
                       </li>
                       <li>
                           <img data-src="/images/phones/lifecell.png" class="lazy" alt="lifecell">
                           <a href="tel:0930803060">(093) 080 30 60</a>
                       </li>
                   </ul>
               </div>
           </div>
       </div>
    </header>

    <section class="row main">
        <div id="catalogue" class="container pad0">
            <div id="catalogue-main">{main_window}</div>
        </div>
    </section>
</div>

<div id="modals" class="modals">
    <div class="modal fade" id="AlertForm" role="dialog" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div id="alert-modal-header" class="modal-header">
                    <div id="choose_title"></div>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body text-left">
                    <div class="container">
                        <div class="row">
                            <div id="choose_message" class="wdt100"></div>
                        </div>
                        <div class="row float-right">
                            <button id="alert_btn_ok" class="btn btn-primary" data-dismiss="modal">OK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!--plugin scripts-->
<script type="text/javascript" src="/js/plugins/bigSlide.js"></script>
<script type="text/javascript" src="/js/plugins/lazyload/lazyload.min.js"></script>
<script type="text/javascript" src="/js/plugins/bootstrap-notify/bootstrap-notify.min.js"></script>
<script type="text/javascript" src="/js/plugins/maskedinput.js"></script>
<!--custom scripts-->
<script type="text/javascript" src="/js/onload.js"></script>
<script type="text/javascript" src="/js/catalogue.js"></script>
<script type="text/javascript" src="/js/menu.js"></script>
<script type="text/javascript" src="/js/shop.js"></script>
<script type="text/javascript" src="/js/client.js"></script>
<script type="text/javascript" src="/js/cars.js"></script>

<script>
    function toggleSocialIcons() {
        $(".anchor-contacts-li-item").toggleClass("anchor-contacts-li-hidden");
        if ($(".anchor-contacts-li-item").hasClass("anchor-contacts-li-hidden")) {
            $(".anchor-contacts-li-main").find("a").find("img").attr("src", "/images/icons/socials/png/chats.png");
        } else {
            $(".anchor-contacts-li-main").find("a").find("img").attr("src", "/images/icons/socials/png/close.png");
        }
    }
</script>
