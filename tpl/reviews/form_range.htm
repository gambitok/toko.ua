<a itemprop="publisher" itemtype="https://schema.org/Organization" itemscope class="reviews-block-item" href="{page_review_link}">
    <div class="reviews-block-item__date">{review_date}</div>
    <div class="reviews-block-item__image"><img src="https://portal.myparts.pro/uploads/images/saved/{review_img}" alt="{review_title}"></div>
    <div class="reviews-block-item__title" itemprop="name">{review_title}</div>
    <div class="reviews-block-item__link">{details_cap} <span class="fas fa-angle-right"></span></div>
</a>
