<div itemprop="publisher" itemtype="https://schema.org/Organization" itemscope class="reviews-block-item">
    <div class="reviews-block-item__date">{review_date}</div>
    <div class="reviews-block-item__title" itemprop="name">{review_title}</div>
    <div class="reviews-block-item__image"><img src="https://portal.myparts.pro/uploads/images/saved/{review_img}" alt="{review_title}"></div>
    <div class="reviews-block-item__link"><a itemprop="url" href="{review_prefix}/reviews/state/{review_state}/{review_transcript}">{details_cap} <span class="fas fa-angle-right"></span></a></div>
</div>
