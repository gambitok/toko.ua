<div class="gallery">
    <div class="gallery-item">
        <div class="gallery-item-image" style="--background: url({banner_image})"></div>
        <div class="gallery-item-panel">
            <div class="gallery-item-panel__title">
                <div class="gallery-item-panel__title-center">
                    {banner_title}
                </div>
            </div>
            <div class="gallery-item-panel__text">
                <div class="gallery-item-panel__text-center">
                    {banner_text}
                </div>
            </div>
        </div>
    </div>
</div>
