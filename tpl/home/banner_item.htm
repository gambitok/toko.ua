<div class="gallery">
    <a {banner_href} class="gallery-item">
        <div class="gallery-item-image">
            <img class="lazy" data-src="{banner_image}" alt="{banner_title}" src="/images/no_photo.svg">
        </div>
        <div class="gallery-item-panel" {banner_text_status}>
            <div class="gallery-item-panel__title">
                <div class="gallery-item-panel__title-center">
                    {banner_title}
                </div>
            </div>
            <div class="gallery-item-panel__text">
                <div class="gallery-item-panel__text-center">
                    {banner_text}
                </div>
            </div>
        </div>
    </a>
</div>
