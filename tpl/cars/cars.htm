<script type="text/javascript" src="/js/cars.js"></script>

<div class="cars">
    <div class="cars-nav">
        <div data-type="manuf" data-next="model" data-pred="empty" data-tab="cars-tab1" data-id="0" class="cars-nav__item cars-nav__item-active cars-nav__item-checked">{auto_cap}</div>
        <div data-type="model" data-next="years" data-pred="manuf" data-tab="cars-tab2" data-id="0" class="cars-nav__item cars-nav__item-disabled">{model_cap}</div>
        <div data-type="years" data-next="bodyc" data-pred="model" data-tab="cars-tab3" data-id="0" class="cars-nav__item cars-nav__item-disabled">{year_cap}</div>
        <div data-type="bodyc" data-next="engin" data-pred="years" data-tab="cars-tab4" data-id="0" class="cars-nav__item cars-nav__item-disabled cars-nav__item-hidden">{model_number}</div>
        <div data-type="engin" data-next="modif" data-pred="bodyc" data-tab="cars-tab5" data-id="0" class="cars-nav__item cars-nav__item-disabled cars-nav__item-hidden">{engine_cap}</div>
        <div data-type="modif" data-next="empty" data-pred="engin" data-tab="cars-tab6" data-id="0" class="cars-nav__item cars-nav__item-disabled cars-nav__item-hidden">{modification_cap}</div>
    </div>

    <div id="cars_tab" class="cars-tab">
        <div data-type="manuf" data-next="model" data-pred="empty" data-tab="cars-tab1" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-active cars-nav__item-checked">{auto_cap}</div>
        <div id="cars-tab1" class="cars-tab__block cars-tab__block-active">{cars_manufactures}</div>

        <div data-type="model" data-next="years" data-pred="manuf" data-tab="cars-tab2" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-disabled">{model_cap}</div>
        <div id="cars-tab2" class="cars-tab__block"></div>

        <div data-type="years" data-next="bodyc" data-pred="model" data-tab="cars-tab3" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-disabled">{year_cap}</div>
        <div id="cars-tab3" class="cars-tab__block"></div>

        <div data-type="bodyc" data-next="engin" data-pred="years" data-tab="cars-tab4" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-disabled cars-nav__item-hidden">{model_number}</div>
        <div id="cars-tab4" class="cars-tab__block"></div>

        <div data-type="engin" data-next="modif" data-pred="bodyc" data-tab="cars-tab5" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-disabled cars-nav__item-hidden">{engine_cap}</div>
        <div id="cars-tab5" class="cars-tab__block"></div>

        <div data-type="modif" data-next="empty" data-pred="engin" data-tab="cars-tab6" data-id="0" class="cars-nav__item cars-nav__item-mob cars-nav__item-disabled cars-nav__item-hidden">{modification_cap}</div>
        <div id="cars-tab6" class="cars-tab__block"></div>
    </div>
</div>
