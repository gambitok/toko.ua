<div class="content">

    <label for="regions_list">Choose region:</label>
    <select name="regions_list" id="regions_list" class="form-control">
        {regions_list}
    </select>

    <br>
    <label for="cities_list">Choose city:</label>
    <select name="cities_list" id="cities_list" class="form-control">
        {cities_list}
    </select>

    <br>
    <label for="districts_list">Choose district:</label>
    <select name="districts_list" id="districts_list" class="form-control">
        {districts_list}
    </select>

    <br>
    <button onclick="ajaxTest()" class="btn">Submit</button>

</div>

<script>
    function ajaxTest()
    {
        let region_id = $("#regions_list option:selected").val();
        $.ajax({
            type: "post",
            url: '/content_ajax.php',
            data: {foo: region_id},
            success: function(response)
            {
                console.log(response);
                let jsonData = JSON.parse(response);

                if (jsonData.success === 1)
                {
                    alert(jsonData.text);
                } else {
                    alert('error!');
                }
            }
        });

        return true;
    }
</script>
