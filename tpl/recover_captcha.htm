<link rel="stylesheet" href="/captcha/css/style.css">

<script type='text/javascript'>
    function refreshCaptcha(){
        let img = document.images['captchaimg'];
        img.src = img.src.substring(0,img.src.lastIndexOf("?"))+"?rand="+Math.random()*1000;
    }
</script>

<style>
    label.alert-danger {
        padding: 15px;
        display: block;
        margin-bottom: 15px;
    }
</style>

<div class="content">
    {message}

    <h1>{captcha_cap}</h1>
    <br>
    <form action="" method="post" name="form1" id="form1" class="table_captcha">
        <input name="recover_phone" type="hidden" value="{form_phone}">
        <p><img src="/captcha/captcha.php?rand=<?php echo rand();?>" id='captchaimg'></p>
        <br>
        <p><label for='message'>{cant_read_code}:</label></p>
        <p><input id="captcha_code" name="captcha_code" type="text" class="form-control" style="width: 300px"></p>
        <p>{click_to_refresh} <a href='javascript: refreshCaptcha();'>{here_cap}</a>.</p>
        <br>
        <p><input name="Submit" type="submit" value="{send_sms}" class="btn btn-primary" style="width: 300px"></p>
    </form>
</div>
