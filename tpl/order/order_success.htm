<div class="content">
	<div class="container order-success">

        <div class="row align-items-center order-success-row">
            <div class="col-lg-12 col-12">
                <h5>{order_cap} #{order_id} {order_is_executed}!</h5>
                <input type="hidden" id="reg_client_id" value="{client_id}">
                <input type="hidden" id="reg_order_id" value="{order_id}">
            </div>
        </div>

        <div class="row order-success-row">
            <div class="col-12">
                <p>{order_succes}
                    <b class="{status_logout}">{order_succes_reg}</b>
                </p>
            </div>
        </div>

        <div class="row order-success-row {status_logout}">
            <div class="col-lg-4 col-12">
                <label class="label-required">{client_password_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_password" title="{client_password_cap}" placeholder="{client_password_cap}" class="form-control" type="password" autocomplete="off">
                <div class="box">
                    <input id="show_pass" name="show_pass" checked="checked" type="checkbox" class="check-mark" onclick="togglePass(this);">
                    <label for="show_pass">{show_pass}</label>
                </div>
            </div>
        </div>

        <div class="row order-success-row {status_logout}">
            <div class="col-lg-4 col-12">
                <label>{phone_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_phone" disabled value="{input_phone}" title="{phone_number}" placeholder="{phone_number}" class="form-control" type="text">
            </div>
        </div>

        <div class="row order-success-row {status_logout}">
            <div class="col-lg-4 col-12">
                <label>{email_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_email" value="{input_email}" title="{email_cap}" placeholder="{email_cap}" class="form-control" type="email">
            </div>
        </div>

        <div class="row order-success-row {status_logout}">
            <div class="col-lg-4 col-12">
                <label>{full_name_cap}:</label>
            </div>
            <div class="col-lg-8 col-12">
                <input id="reg_name" value="{input_name}" title="{name_surname}" placeholder="{name_surname}" class="form-control" type="text">
            </div>
        </div>

        <br>

        <div class="row order-success-row">
            <div class="col-lg-12 col-12 order-success-row-buttons">
                <input type="submit" class="btn btn-primary {status_logout}" value="{order_success_save}" onclick="saveClientRetail();">
                <input type="submit" class="btn btn-secondary {status_logout}" value="{order_success_delete}" onclick="deleteClientRetail();">
                <input type="submit" class="btn btn-primary {status_login}" value="{order_success_show}" onclick="showProfilePageOrders();">
            </div>
        </div>

	</div>
</div>
