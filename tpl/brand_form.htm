<div class="modal-brand">
    <h2>{about_brand_cap} <span>{brand_form_name} <img itemprop="image" class="flag flag-{brand_form_country}"></span></h2>
    <div class="row">
        <div class="col-12 col-lg-10">
            <p class="modal-brand__text">{brand_form_descr}</p> <br>
            <a rel="nofollow" content="nofollow" href="{brand_form_link}" target="_blank">{brand_form_link}</a>
        </div>
        <div class="col-12 col-lg-2">
            <div class="modal-brand-logo">
                <img
                    class="lazy modal-brand-logo__image"
                    itemprop="image"
                    src="/images/no_photo.svg"
                    data-src="https://portal.myparts.pro/cdn/brands_files/{brand_form_logo_name}"
                    alt="{brand_form_logo_name}"
                >
            </div>
        </div>
    </div>
</div>
