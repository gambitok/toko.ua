<span>{brand_form_name} <img itemprop="image" class="flag flag-{brand_form_country}"></span>
<div class="row">
    <div class="col-12 col-lg-10">
        <p style="font-size: 12px; text-align: justify;">{brand_form_descr}</p> <br>
        <a rel="nofollow" content="nofollow" href="{brand_form_link}" target="_blank">{brand_form_link}</a>
    </div>
    <div class="col-12 col-lg-2">
        <div style="max-width: 300px; max-height: 300px;">
            <img itemprop="image" src="https://portal.myparts.pro/cdn/brands_files/{brand_form_logo_name}" alt="{brand_form_logo_name}" style="width: 100%; height: 100%;">
        </div>
    </div>
</div>
