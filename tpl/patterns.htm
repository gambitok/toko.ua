<div class="container">
    <div class="row">

        <div class="col-12 order-1 col-lg-3 order-lg-0 content template_filters">
            <div id="template_filters">
                {products_filters}
            </div>
            <a class="btn btn-warning wdt100" href="https://toko.ua{products_lang_prefix}/products/{products_name}/" style="margin-top: 2em;margin-bottom: 2em;">{filter_cap_empty}</a>
        </div>

        <div class="col-12 order-0 col-lg-9 order-lg-1 content template_content">

            <h1>{products_title}</h1>
            <div id="template_checked">{products_checked}</div>
            <span id="template_count" class="template_content-count">{products_count}</span>

            <div id="template_products">
                {products_list}
            </div>

            <div id="template_pagination">
                {products_pagination}
            </div>

        </div>

    </div>
</div>
