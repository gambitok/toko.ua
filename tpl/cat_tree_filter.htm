<div class="side-tree">
    <div class="side-tree-title">
        <i class="fa fa-wrench"></i> {det_group}
    </div>
    <div class="side-tree-search">
        <input type="search" id="my-search" class="text-filter" placeholder="{search_by_category}">
    </div>
    <div class="side-tree-return {tree_catalogue_class}">
        <a href="{tree_catalogue}"><i class="fa fa-caret-left"></i> {back_to_catalogue}</a>
    </div>
    <div class="side-tree-list">
        <ul id="my-tree" class="tf-tree">
            {tree_filter}
        </ul>
    </div>
</div>
