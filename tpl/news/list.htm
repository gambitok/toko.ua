
<div itemprop="publisher" itemtype="https://schema.org/Organization" itemscope class="row news-block__item">
    <div class="col-8">
        <h4>{date}</h4>
        <h2 itemprop="name">{title}</h2>
        <h3 itemprop="description">{short_desc}</h3>
        <br>
        <a itemprop="url" href="{link}">
            {details_cap} <span class="fas fa-angle-right"></span>
        </a>
    </div>
    <div class="col-4" style="padding: 10px 0;">
        {img}
    </div>
</div>
