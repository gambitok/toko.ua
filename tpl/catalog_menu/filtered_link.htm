    <div class="tree-group__item-image">
        <img data-src="/images/tree-group/{group_img}" class="lazy" alt="{group_name} {brand_name}"
             src="/images/no_photo.svg">
    </div>
    <div class="tree-group__item-text">
        <span>{group_name} {brand_name}</span>
    </div>
</a>
