<link rel="stylesheet" href="/css/plugins/flags.min.css">

<input type="hidden" value="{details_str_id}" id="details_str_id">
<input type="hidden" value="{details_active_filters}" id="details_active_filters">
<input type="hidden" value="{details_page}" id="details_page">
<input type="hidden" value="{details_str_type}" id="details_str_type">
<input type="hidden" value="{details_link}" id="details_link">

<div class="container">
    <div class="row details-offers">
        <div class="col-lg-3 col-12 order-lg-0 order-1 content details-offers-side">
            <div id="catalog-filters">
                <span>{brands_cap}</span>
                <div id="search_brands_form">
                    {details_brands}
                </div>
                <div id="search_linking_form">
                    {details_linking}
                </div>
            </div>
        </div>
        <div class="col-lg-9 col-12 order-lg-1 order-0 content">
            <div class="details-offers__header">
                <h1>{details_title}</h1>
                <span id="details_count">{details_count}</span>
            </div>
            {details_content}
            <div class="details-offers__pagination">
                <div id="details_pagination"></div>
            </div>
        </div>
    </div>

    <div class="row" style="margin-top: 15px;">
        <div class="col-12 pad0">
            <div class="content-auto seo_auto seo_details">
                {seo_auto}
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 pad0">
            <div class="content-min" style="margin: 15px 0;">
                {details_faq}
            </div>
        </div>
    </div>

</div>

<div id="fixed-nav-catalog" class="fixed-nav">
    <div class="fixed-nav-item" onclick="showGarageForm();">
        <div class="tool-status-contain">
            <span id="tool-garage" class="tool-status {garage_style}">!</span>
        </div>
        <img class="fixed-nav-item__image" src="/images/icons/help/car.png" alt="img">
        <span class="fixed-nav-item__text">{garage_cap_upper}</span>
    </div>

    <div class="fixed-nav-item" onclick="showPhoneForm();">
        <img class="fixed-nav-item__image" src="/images/icons/help/help.png" alt="img">
        <span class="fixed-nav-item__text">{call_cap}</span>
    </div>

    <div class="fixed-nav-item" onclick="showArtSearch();">
        <img class="fixed-nav-item__image" src="/images/icons/help/search.png" alt="img">
        <span class="fixed-nav-item__text">{search_cap}</span>
    </div>

    <div class="fixed-nav-item bar-catalog" onclick="setCatalogFilters();">
        <img class="fixed-nav-item__image" src="/images/icons/help/filter.png" alt="img">
        <span class="fixed-nav-item__text">{filter_cap}</span>
    </div>

    <div class="fixed-nav-item" onclick="showBasketMinForm();">
        <div class="tool-status-contain">
            <span id="tool-basket" class="tool-status {basket_style}">{basket_count}</span>
        </div>
        <img class="fixed-nav-item__image" src="/images/icons/help/basket.png" alt="img">
        <span class="fixed-nav-item__text">{basket_cap}</span>
    </div>
</div>

<script>
    $(document).ready(function() {
        showSearchParameters();
        $(".anchor-contacts").addClass("mob-non-display");
    });
</script>

<!-- Modal Cars -->
<div class="modal fade" id="VinFormPhone" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <div class="request">
                    <div class="request-row request-row-mob" style="display: flex">
                        <div class="request-row__image"><img src="/images/icons/faq/vin-icon.png" alt="Icon"></div>
                        <div class="request-row__title">
                            <span style="color: #0CA9EE;">{faq_request_title}</span><br>
                            <span style="color: #36cd76;">{faq_request_title2}</span>
                        </div>
                    </div>
                    <div class="request-row request-row-mob">
                        <input id="req-phone" class="masked-phone" type="tel" placeholder="{phone_cap}">
                    </div>
                    <div class="request-row request-row-mob">
                        <input id="req-vin" class="masked-vin" type="text" placeholder="{vin_cap}">
                    </div>
                    <div class="request-row request-row-mob">
                        <textarea id="req-text" placeholder="{spare_parts_list}"></textarea>
                    </div>
                    <div class="request-row request-row-mob">
                        <input type="submit" value="{send_seller}" onclick="setClientRequest2();">
                    </div>
                    <div class="request-row request-row-mob">
                        <div class="request-row__text" style="text-align: left">
                            <span>{faq_request_about}</span>
                            <a onclick="$('#VinForm').modal('show');">{faq_request_about2} <span class="fa fa-info-circle"></span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
