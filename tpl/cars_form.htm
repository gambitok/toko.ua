<div class="row">
    <div class="col-10">
        <span class="car_form-select-h">{cars_title}</span>
    </div>
    <div class="col-2 text-right">
        <a class="show_more_title" onclick="toggleBlock('show_more_title','cars_range-title');"><i class="rotate_anime fas fa-chevron-down"></i></a>
    </div>
</div>

<input type="hidden" id="mfa_select" value="{mfa_select}" placeholder="mfa">
<input type="hidden" id="model_select" value="{model_select}" placeholder="model">
<input type="hidden" id="str_text_select" value="{str_text_select}" placeholder="str_text">

<div id="cars_range-title" class="cars_range-title">
    <div class="row mar0">
        <div class="col-12 col-lg-2">
            <span class="cars_range-title-h {mfa_style}" onclick="showCarsSelectLink();">{mfa_search}</span>
        </div>
        <div class="col-12 col-lg-2">
            <span class="cars_range-title-h {model_style}">{model_search}</span>
        </div>
        <div class="col-12 col-lg-2">
            <span class="cars_range-title-h">{year_cap}</span>
        </div>
        <div class="col-12 col-lg-2">
            <span class="cars_range-title-h">{model_number}</span>
        </div>
        <div class="col-12 col-lg-2">
            <span class="cars_range-title-h">{engine_cap}</span>
        </div>
    </div>
    <div class="row cars_range-main">
        <div class="col-12">
            {range_manuf}
            {range_model}
        </div>
    </div>
</div>
