
<link rel="stylesheet" href="/app/fonts/fontawesome_web/css/all-minify.css">
<link rel="stylesheet" href="/js/plugins/OwlCarousel2-2.3.4/assets/owl.carousel.min.css" />

<div class="content telegram-content">

    <div class="row">
        <div class="col-lg-10 col-10">
            <h1>{telegram_bot_cap}</h1>
            <br>
            <a href="https://t.me/tokoua_robot" rel="noopener" target="_blank">
                <i class="fa fa-link"></i> {telegram_bot_text}
            </a>
        </div>
        <div class="col-lg-2 col-2">
            <img src="/images/telegram_bot_logo.webp" alt="Telegram Bot" style="width: 80px; float: right; margin-bottom: 15px;">
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6 col-12">
            <div id="owl3d" class="owl-carousel owl-theme">
                <div><img src="/images/telegram%20bot/toko-ua-bot-01.webp" alt="Telegram Bot 1"></div>
                <div><img src="/images/telegram%20bot/toko-ua-bot-02.webp" alt="Telegram Bot 2"></div>
                <div><img src="/images/telegram%20bot/toko-ua-bot-03.webp" alt="Telegram Bot 3"></div>
                <div><img src="/images/telegram%20bot/toko-ua-bot-04.webp" alt="Telegram Bot 4"></div>
                <div><img src="/images/telegram%20bot/toko-ua-bot-05.webp" alt="Telegram Bot 5"></div>
                <div><img src="/images/telegram%20bot/toko-ua-bot-06.webp" alt="Telegram Bot 6"></div>
            </div>
        </div>

        <div class="col-lg-6 col-12">
            <p>{telegram_bot_descr}</p>
            <br>
            <p>{telegram_bot_descr_01}</p>
            <br>
            <p>{telegram_bot_descr_02}</p>
            <br>
            <p>{telegram_bot_descr_03}</p>
            <br>
            <a href="https://t.me/tokoua_robot" rel="noopener" target="_blank" class="btn btn-info" style="display: block; margin: 0 auto; width: 300px;">
                {open_in_cap} Telegram <i class="fa fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <br>
   {telegram_bot_updates}

</div>

<script src="/js/plugins/OwlCarousel2-2.3.4/owl.carousel.min.js"></script>
<script>
    var owl3 = $('#owl3d');
    owl3.owlCarousel({
        loop:true,
        nav:true,
        dots:true,
        margin:10,
        autoplay:false,
        responsive:{
            0:{
                items:1
            },
            600:{
                items:3
            },
            960:{
                items:4
            },
            1200:{
                items:4
            }
        }
    });
    owl3.on('mousewheel', '.owl-stage', function (e) {
        if (e.deltaY>0) {
            owl3.trigger('next.owl');
        } else {
            owl3.trigger('prev.owl');
        }
        e.preventDefault();
    });
</script>
