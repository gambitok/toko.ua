<div class="row">
    <div class="col-12">
        {list_params}
    </div>
</div>

<script>
    function toggleSideMenu(e) {
        $(e).prev().toggleClass('show');
        $(e).find("span").each(function() {
           $(this).toggleClass('none');
        });
    }
    function textParamSearch(param_id) {
        let search = $("input[data-attr='" + param_id + "']").val().toLowerCase();
        if (search !== "") {
            $("div[data-attr-more='" + param_id + "']").addClass("none");
        } else {
            $("div[data-attr-more='" + param_id + "']").removeClass("none");
        }
        $("div[data-param-value='" + param_id + "'] span").each(function () {
            let text = $(this).text().toLowerCase();
            let indexOfText = text.indexOf(search); // 0 OR -1
            console.log(search + " = " + text + " = " + indexOfText);
            if (indexOfText >= 0) {
                $(this).parent().parent().css('display', 'flex');
            } else {
                $(this).parent().parent().css('display', 'none');
            }
        });
    }
</script>
