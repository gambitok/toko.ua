<div class="container {search_target_class}">
    <div class="row search_title">
        <span class="span-dark">{offers_request} <span class="span-red">{brand_name} {article_nr_displ}</span></span>
    </div>
    <div id="tables2" class="container tables">
        <div class="row tables__title">
            <div class="col-lg-2 pointer">
                {index_cap}
            </div>
            <div class="col-lg-3">{caption_cap}</div>
            <div class="col-lg-2 text-center pointer">
                {storage_info}
            </div>
            <div class="col-lg-1 text-center pointer pad0">
                {available_cap}
            </div>
            <div class="col-lg-2 text-center pointer">
                {price_cap}
            </div>
            <div class="col-lg-1">&nbsp</div>
        </div>
        {search_target_list}
    </div>
</div>

<div class="container {search_list_style}">

        <span class="span-dark">{analogs_cap} {for_cap} <h1 class="span-red">{brand_name} {article_nr_displ}</h1></span>
    </div>
    <div id="tables" class="container tables">
        <div class="row tables__title">
            <div class="col-lg-2 pointer">
                {index_cap}
            </div>
            <div class="col-lg-3">{caption_cap}</div>
            <div class="col-lg-2 text-center pointer">
                {storage_info}
            </div>
            <div class="col-lg-1 text-center pointer pad0">
                {available_cap}
            </div>
            <div class="col-lg-2 text-center pointer">
                {price_cap}
            </div>
            <div class="col-lg-1">&nbsp</div>
        </div>
        {search_list}
    </div>
</div>
