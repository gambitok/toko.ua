<div class="row">
    <div class="col-12">
        <div class="hidden-list">
            <div class="hidden-list-title">
                {show_filters_cars}
            </div>
            <div class="hidden-list-content">
                <a href="./?status_auto_type=1" class="hidden-list-content__item {on_car_disable}">
                    <div class="hidden-list-content__item-left">
                        {on_car_checked}
                        <span>{on_cap} {typ_text}</span>
                    </div>
                    <div class="hidden-list-content__item-right">
                        {on_car_count}
                    </div>
                </a>
                <a href="./?status_auto_type=0" class="hidden-list-content__item">
                    <div class="hidden-list-content__item-left">
                        {on_all_checked}
                        <span>{show_all_car}</span>
                    </div>
                    <div class="hidden-list-content__item-right">
                        {on_all_count}
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
