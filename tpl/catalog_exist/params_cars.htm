<div class="row">
    <div class="col-12">
        <div class="hidden-list">
            <div class="hidden-list-title">
                {show_filters_cars}
            </div>
            <div class="hidden-list-content">
                <a onclick="setStatusAutoType(this);" data-cookie-value="1" class="hidden-list-content__item" style="cursor:pointer;">
                    <div class="hidden-list-content__item-left">
                        {on_car_checked}
                        <span>{on_cap} {typ_text}</span>
                    </div>
                    <div class="hidden-list-content__item-right">
                        {on_car_count}
                    </div>
                </a>
                <a onclick="setStatusAutoType(this);" data-cookie-value="0" class="hidden-list-content__item" style="cursor:pointer;">
                    <div class="hidden-list-content__item-left">
                        {on_all_checked}
                        <span>{show_all_car}</span>
                    </div>
                    <div class="hidden-list-content__item-right">
                        {on_all_count}
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    function setStatusAutoType(e) {
        let status_auto_type = $(e).attr("data-cookie-value");
        setCookie("status_auto_type", status_auto_type);
        location.reload();
    }
</script>
