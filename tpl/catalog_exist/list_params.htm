<link rel="stylesheet" href="/css/plugins/flags.min.css">

<input type="hidden" id="status_auto" value="{status_auto}">

<div class="container">
    <div class="row cat-products">
        <div class="col-12">
            <div class="bread">
                {parts_breadcrumbs}
            </div>
        </div>
    </div>
    <div class="row cat-products">
        <div class="col-12">
            <div class="cat-products-cars">
                {parts_cars}
            </div>
        </div>
    </div>
    <div class="row cat-products">
        <div class="col-12">
            <div class="cat-products-title">
                <h1 class="cat-products-title__h1">{parts_title}</h1>
                <div class="cat-products-title__filters">
                    <span class="cat-products-title__count">{parts_count}</span>
                    {parts_filters}
                </div>
            </div>
        </div>
    </div>
    <div class="row cat-products">
        <div class="col-12 col-lg-3 order-lg-0 order-1">
            <div class="cat-products-filters">
                {parts_params_cars}
                {parts_params}
            </div>
        </div>
        <div class="col-12 col-lg-9 order-lg-1 order-0">
            <div class="row">
                <div class="col-12">
                    <div class="cat-products-list">
                        {parts_list}
                    </div>
                </div>
                <div class="col-12">
                    <div class="cat-products-pagination">
                        {parts_pagination}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row cat-products">
        <div class="col-12">
            {parts_seo}
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        if ($("#status_auto").val() == "1") {
            toggleCarsNavigation($("div[data-type='manuf']"));
        }
    });
</script>
