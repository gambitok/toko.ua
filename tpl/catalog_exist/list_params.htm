<div class="metro">
    <div class="row products">
        <div class="col-3">
            <div class="products-filters">
                {parts_params}
            </div>
        </div>
        <div class="col-9">
            <div class="row">
                <div class="col-12">
                    <div class="products-title">
                        <h1 class="products-title__h1">{parts_title}</h1>
                        <p class="products-title__count">{parts_count}</p>
                        <div class="products-title__filters">{parts_filters}</div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="products-list">
                        {parts_list}
                    </div>
                </div>
                <div class="col-12">
                    <div class="products-pagination">
                        {parts_pagination}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
