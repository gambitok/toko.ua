<div class="container">
    <div class="row cat-products">
        <div class="col-12">
            <div id="cat-products-cars">
                {parts_cars}
            </div>
        </div>
    </div>
    <div class="row cat-products" style="margin-top: 30px;">
        <div class="col-12">
            <div class="catalogue-error">
                <h1>{catalog_exist_error}</h1>
                <div class="row">
                    <div class="col-lg-3 col-12 order-lg-0 order-1">
                        <div class="catalogue-error__image">
                            <img class="lazy" data-src="/images/sad_car.png" src="/images/no_photo.svg" alt="404">
                        </div>
                    </div>
                    <div class="col-lg-9 col-12 order-lg-1 order-0">
                        <div>
                            <p>{catalog_exist_error_1}</p>
                            <p>{catalog_exist_error_2}</p>
                            <p>{catalog_exist_error_3}</p>
                        </div>
                        <div class="catalogue-error__contacts">
                            <div>
                                <ul class="modal-help-row-phones">
                                    <li>
                                        <img data-src="/images/phones/kyivstar.png" class="lazy" alt="kyivstar" src="/images/no_photo_min.png">
                                        <a href="tel:0970803060"><span>(097)</span> 080 30 60</a>
                                    </li>
                                    <li>
                                        <img data-src="/images/phones/vodafone.png" class="lazy" alt="vodafone" src="/images/no_photo_min.png">
                                        <a href="tel:0500803060"><span>(050)</span> 080 30 60</a>
                                    </li>
                                    <li>
                                        <img data-src="/images/phones/lifecell.png" class="lazy" alt="lifecell" src="/images/no_photo_min.png">
                                        <a href="tel:0930803060"><span>(093)</span> 080 30 60</a>
                                    </li>
                                </ul>
                            </div>
                            <div class="modal-help-row-socials">
                                <a href="https://t.me/tokoua_bot" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                                    <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__telegram ">
                                        <img src="/images/icons/socials/png/telegram.png" alt="Telegram">
                                    </div>
                                </a>
                                <a href="viber://pa?chatURI=tokogroup" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                                    <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__viber ">
                                        <img src="/images/icons/socials/png/viber.png" alt="Viber">
                                    </div>
                                </a>
                                <a href="http://m.me/tokogroup" rel="noopener" target="_blank" class="modal-help-row-socials__item">
                                    <div class="modal-help-row-socials__item-image modal-help-row-socials__item-image__facebook ">
                                        <img src="/images/icons/socials/png/facebook.png" alt="Facebook">
                                    </div>
                                </a>
                            </div>
                        </div>
                        <div>
                            <p>{catalog_exist_error_4}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="VinFormPhone" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <div class="request">
                    <div class="request-display" style="display: flex">
                        <div class="request-row__image"><img src="/images/icons/faq/vin-icon.png" alt="Icon"></div>
                        <div class="request-row__title">
                            <span style="color: #0CA9EE;">{faq_request_title}</span><br>
                            <span style="color: #36cd76;">{faq_request_title2}</span>
                        </div>
                    </div>
                    <div class="request-display">
                        <input id="req-phone" class="masked-phone" type="tel" placeholder="{phone_cap}">
                    </div>
                    <div class="request-display">
                        <input id="req-vin" class="masked-vin" type="text" placeholder="{vin_cap}">
                    </div>
                    <div class="request-display">
                        <textarea id="req-text" placeholder="{spare_parts_list}"></textarea>
                    </div>
                    <div class="request-display">
                        <input type="submit" value="{send_seller}" onclick="setClientRequest2();">
                    </div>
                    <div class="request-display">
                        <div class="request-row__text" style="text-align: left">
                            <span>{faq_request_about}</span>
                            <a onclick="$('#VinForm').modal('show');">{faq_request_about2}</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        getCarsSelectUser("cat-products-cars", "{mfa_link}", "{model_link}");
    });
</script>
